# sky-notify startup configuration. This file is read once; hot-reloaded settings live
# in alerts.yaml. Mount at /config/config.yaml or point SKY_CONFIG elsewhere.
# Environment wins over YAML.
#
# Nothing below is guessed for you. Every key here except tar1090_url is REQUIRED:
# they describe your deployment — which feeder, which ntfy server, which database
# mirror, which volume — and a wrong guess would silently talk to the wrong host.

source:
  # An http(s) URL, or an absolute path if you bind-mount the feeder's data directory.
  # e.g. http://ultrafeeder/data/aircraft.json, or /run/ultrafeeder/aircraft.json
  url: ""
  # aircraft.json carries its own timestamp. Reject stale or future-dated data.
  max_age: 60s

ntfy:
  url: ""              # e.g. https://ntfy.sh, or your own https://ntfy.example.com
  topic: ""            # On a public ntfy server the topic name is the only secret.
  # token: tk_...      # Bearer token, or:
  # user: someone
  # password: secret

db:
  # The first file to define an ICAO wins. In the plane-alert-db project
  # plane-alert-db.csv is the superset.
  files: []
  # Where those files are served from, e.g.
  # https://raw.githubusercontent.com/sdr-enthusiasts/plane-alert-db/main
  base_url: ""

# Holds the cached list and the cooldown ledger. Put a volume here.
cache_dir: ""

# Optional: makes each notification click through to your own map.
tar1090_url: ""

# Every notification carries a PNG map of where the aircraft is. Unlike the endpoints
# above this one has a default: OpenFreeMap is a free public service with no key and no
# account, so nothing here is a guess about your deployment. Tiles are cached under
# cache_dir. A map that cannot be drawn or cannot be delivered costs the notification its
# picture, never the notification.
map:
  enabled: true
  # tiles_url: https://tiles.openfreemap.org/planet   # or your own OpenFreeMap

# Optional: the AI provider that answers a rule with `research: true`, which puts a line
# in the notification saying who the aircraft belongs to. Off unless url and model are
# both set. Any OpenAI-compatible provider works — OpenRouter, vLLM, Ollama, LiteLLM,
# Together, Groq, OpenAI — because url is a base and "/chat/completions" is appended.
#
# The key lives here rather than in alerts.yaml because the web UI is served the whole of
# alerts.yaml: a key there would be a key on a page.
#
# Nothing here searches the web; pick a model that does its own (perplexity/sonar, or an
# ":online" suffix on OpenRouter) if the answer needs more than the model remembers.
# A call that fails costs the notification that one line, never the notification.
# ai:
#   url: https://openrouter.ai/api/v1
#   key: sk-or-v1-...
#   model: perplexity/sonar
#   timeout: 20s        # the default

listen: ":8080"
