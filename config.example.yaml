# sky-notify startup configuration — every key is optional except ntfy.topic.
# This file is read once. Hot-reloaded settings live in alerts.yaml.
# Mount at /config/config.yaml or point SKY_CONFIG elsewhere. Environment wins over YAML.

source:
  # An http(s) URL, or an absolute path if you bind-mount ultrafeeder's data directory.
  url: http://ultrafeeder/data/aircraft.json
  # aircraft.json carries its own timestamp. Reject stale or future-dated data.
  max_age: 60s

ntfy:
  url: https://ntfy.sh
  topic: ""            # REQUIRED. On public ntfy.sh the topic name is the only secret.
  # token: tk_...      # Bearer token, or:
  # user: someone
  # password: secret

db:
  # The first file to define an ICAO wins. plane-alert-db.csv is the superset.
  files:
    - plane-alert-db.csv
  base_url: https://raw.githubusercontent.com/sdr-enthusiasts/plane-alert-db/main

# Holds the cached list and cooldown ledger. Put a volume here.
cache_dir: /data

# Optional: makes each notification click through to your own map.
tar1090_url: ""

listen: ":8080"
