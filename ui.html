/* One token set, defined once on :root and redefined only by value. Nothing below the
   palette blocks names a colour directly, so both themes stay in step. */
:root{
  --bg:#F5F6F9; --panel:#FFF; --sunk:#EFF1F5; --line:#E1E4EB; --line2:#C9D0DA;
  --fg:#12161C; --fg2:#57616F; --fg3:#828D9C;
  --acc:#2B55C8; --acc-fg:#FFF; --acc-soft:#E9EEFB;
  --warn:#8A4A0B; --warn-soft:#FBF1E3; --warn-line:#E3C599;
  --bad:#A8261E; --bad-soft:#FCEBE9; --bad-line:#EDB9B4;
  --good:#0F6B3F; --good-soft:#E4F3EB;
  --sh1:0 1px 2px rgba(18,22,28,.07);
  --sh2:0 10px 28px -12px rgba(18,22,28,.34), 0 2px 6px -2px rgba(18,22,28,.14);
  --r:9px; --rs:6px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0C0F13; --panel:#151A20; --sunk:#1C222A; --line:#262D36; --line2:#39424E;
  --fg:#E7ECF2; --fg2:#98A3B1; --fg3:#6B7686;
  --acc:#88A6FF; --acc-fg:#0C0F13; --acc-soft:#1A2440;
  --warn:#E4B173; --warn-soft:#2A2115; --warn-line:#4A3A1E;
  --bad:#F09189; --bad-soft:#2B1817; --bad-line:#4D2723;
  --good:#62C490; --good-soft:#11281D;
  --sh1:0 1px 2px rgba(0,0,0,.55);
  --sh2:0 12px 30px -14px #000, 0 2px 8px -3px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme=dark]{
  --bg:#0C0F13; --panel:#151A20; --sunk:#1C222A; --line:#262D36; --line2:#39424E;
  --fg:#E7ECF2; --fg2:#98A3B1; --fg3:#6B7686;
  --acc:#88A6FF; --acc-fg:#0C0F13; --acc-soft:#1A2440;
  --warn:#E4B173; --warn-soft:#2A2115; --warn-line:#4A3A1E;
  --bad:#F09189; --bad-soft:#2B1817; --bad-line:#4D2723;
  --good:#62C490; --good-soft:#11281D;
  --sh1:0 1px 2px rgba(0,0,0,.55);
  --sh2:0 12px 30px -14px #000, 0 2px 8px -3px rgba(0,0,0,.6);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font:400 14.5px/1.55 'Public Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  font-variant-numeric:tabular-nums}
::selection{background:var(--acc-soft);color:var(--fg)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:var(--rs)}
*{scrollbar-color:var(--line2) transparent;scrollbar-width:thin}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.012em;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
svg{display:block;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
code{font:500 .92em/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  background:var(--sunk);border-radius:4px;padding:1px 4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.lbl{font-size:11.5px;font-weight:650;letter-spacing:.055em;text-transform:uppercase;
  color:var(--fg2);line-height:1.4}
.help{font-size:12.5px;line-height:1.5;color:var(--fg2);max-width:72ch}
.help.warn{color:var(--warn)}
.help.bad{color:var(--bad)}

/* ── Toolbar ──────────────────────────────────────────────────────────── */
.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);
  padding:9px 18px;display:flex;align-items:center;gap:14px}
.top h1{font-size:16px;letter-spacing:-.02em;flex:none}
.top .meta{color:var(--fg3);font-size:12.5px;display:flex;gap:16px;min-width:0;flex:1 1 auto}
.top .meta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .meta span.ltr{flex:none}
.top .acts{display:flex;gap:10px;flex:none}
@media (max-width:700px){
  .top{flex-wrap:wrap}
  .top .meta{order:3;flex-basis:100%}
  .top .acts{margin-left:auto}
}

.btn{border:1px solid var(--line2);background:var(--panel);border-radius:var(--r);
  padding:7px 13px;font-size:13.5px;font-weight:550;box-shadow:var(--sh1);white-space:nowrap;
  transition:background .14s ease,border-color .14s ease,color .14s ease}
.btn:hover:not(:disabled){background:var(--sunk);border-color:var(--fg3)}
.btn:disabled{opacity:.5;cursor:default;box-shadow:none}
.btn.primary{background:var(--acc);color:var(--acc-fg);border-color:transparent}
.btn.primary:hover:not(:disabled){background:var(--acc);filter:brightness(1.1)}
.btn.primary.done{background:var(--good);filter:none}
.btn.icon{padding:0;width:34px;height:34px;display:grid;place-items:center}
.btn.danger{color:var(--bad)}
.btn.danger:hover:not(:disabled){background:var(--bad-soft);border-color:var(--bad-line)}

/* ── Shell ────────────────────────────────────────────────────────────── */
.shell{max-width:1280px;margin:0 auto;padding:16px 18px 80px;
  display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
.msg{grid-column:1/-1;border-radius:var(--r);padding:10px 13px;font-size:13.5px;line-height:1.5;
  border:1px solid}
.msg.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-line)}
.msg.good{background:var(--good-soft);color:var(--good);border-color:var(--good)}

/* ── Rule list ────────────────────────────────────────────────────────── */
.list{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh1);overflow:hidden;position:sticky;top:72px}
.list-h{padding:12px 15px 13px;border-bottom:1px solid var(--line)}
.list-h h2{font-size:14.5px}
.list-h .help{margin-top:5px}
.rows{max-height:min(58vh,600px);overflow:auto}
.row{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:11px;align-items:start;
  width:100%;text-align:left;padding:11px 15px;border-bottom:1px solid var(--line);
  transition:background .12s ease}
.row:hover{background:var(--sunk)}
.row[aria-current=true]{background:var(--acc-soft)}
.row[aria-current=true] .r-name{color:var(--acc)}
.row .n{color:var(--fg3);font-size:12px;font-weight:650;line-height:1.65}
.r-name{font-weight:600;font-size:14px;display:block;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.r-name.anon{font-weight:400;color:var(--fg3);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:13px}
.r-sub{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  color:var(--fg2);font-size:12.5px;line-height:1.45;margin-top:2px}
.row.shadowed .r-sub{color:var(--warn)}
.row.shadowed .r-name{text-decoration:line-through;text-decoration-color:var(--fg3)}
.badge{border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:650;white-space:nowrap;
  background:var(--sunk);color:var(--fg2);line-height:1.5}
.badge.wild{background:var(--warn-soft);color:var(--warn)}
.badge.blind{background:var(--sunk);color:var(--fg3)}
.badge.dead{background:var(--bad-soft);color:var(--bad)}
.badge.wait{color:var(--fg3)}
.list-f{padding:11px 15px;display:grid;gap:8px}
.list-f .btn{width:100%}
.row{cursor:grab}
.row.drag{opacity:.4}
.btn.icon[aria-pressed=true]{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}

/* ── Detail pane ──────────────────────────────────────────────────────── */
.pane{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh1);overflow:hidden;min-width:0}
.pane-h{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;gap:10px}
.pane-h h2{font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.pane-h h2.anon{color:var(--fg3);font-weight:400;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px}
.pane-h .back{display:none}

.group{padding:16px 18px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.group:last-child{border-bottom:0}
.group-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.group-h .help{margin-top:3px}
.group-t{min-width:0}

/* ── Result band ──────────────────────────────────────────────────────── */
.result{background:var(--sunk);border-bottom:1px solid var(--line);padding:16px 18px;
  display:grid;gap:10px}
.result-top{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.big{font-size:32px;font-weight:600;letter-spacing:-.025em;line-height:1;
  font-variant-numeric:tabular-nums}
.big.dead{color:var(--bad)}
.big.wild{color:var(--warn)}
.result-top p{flex:1 1 240px;font-size:13px;line-height:1.5;color:var(--fg2)}
.result-top p.dead{color:var(--bad)}
.hits{border:1px solid var(--line);border-radius:var(--rs);overflow:auto;
  max-height:260px;background:var(--panel);overscroll-behavior-x:contain}
table{width:100%;min-width:430px;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:var(--panel);text-align:left;padding:7px 12px;
  border-bottom:1px solid var(--line);font-size:11.5px;font-weight:650;letter-spacing:.055em;
  text-transform:uppercase;color:var(--fg2);z-index:1}
td{padding:7px 12px;border-bottom:1px solid var(--line);vertical-align:top;
  overflow-wrap:anywhere}
tbody tr:last-child td{border-bottom:0}
td.reg{font-weight:600;white-space:nowrap}
td.tg{color:var(--fg3)}
td.num{white-space:nowrap;font-variant-numeric:tabular-nums}
.more{width:calc(100% - 20px);margin:10px}

/* ── Sent alerts ──────────────────────────────────────────────────────────
   Reuses the .hits scroll box: a taller one, because a notification is a paragraph and
   not a row. */
.hits.sent{max-height:340px;min-width:0}
.sent-i{padding:10px 12px;border-bottom:1px solid var(--line);display:grid;gap:5px}
.sent-i:last-of-type{border-bottom:0}
.sent-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}

<!--
THESIS: The rule set is the page, read as a sequence of plain sentences with a coverage
  figure on every one, because a rule that matches nothing is this product's characteristic
  failure. It refuses the settings-form arrangement where rules are a subsection and
  coverage is something you ask for.
OWN-WORLD: The operations-console canon, played straight. Cool-biased neutrals, one indigo
  accent, semantic amber and red kept separate from it, Public Sans embedded as a latin
  subset, 9px radii, one-pixel hairlines, shadows only on the two panels.
STORY: The operator reads down the list, sees what each rule catches and how much of the
  database it covers, opens the one selecting nothing, fixes it, saves.
FIRST VIEWPORT: Toolbar with the file path and database size; rule list on the left with
  coverage badges aligned in one column; the selected rule on the right, its figure first.
FORM: The category canon, taken as the standing exit from the direction roll (seed
  5f01975e) after three built prototypes.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
<div class="top">

      <h2>Rules</h2>

      Nothing alerts unless a rule matches — emergency squawks included.</p>
    </div>

    <div class="list-f">
      <button class="btn" id="add">Add a rule</button>
    </div>

  <section class="pane" id="pane" aria-live="polite"></section>
</div>

<script>
/* ─────────────────────────────────────────────────────────────────────────
   sky-notify alert settings.

   The page edits alerts.yaml through three endpoints: GET /api/alerts for the
   document plus the database's vocabulary and the env-locked keys, POST
   /api/preview for what one rule selects, and PUT /api/alerts to write it back.

   A rule is an allowlist, so the failure worth designing against is the rule
   that matches nothing: it costs every alert it was meant to catch and the YAML
   looks perfect. Coverage is therefore on screen at all times, never on request.
   ───────────────────────────────────────────────────────────────────────── */

const $ = s => document.querySelector(s);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c;
  if (x != null) n.textContent = x; return n; };
const svg = (d, s = 16) =>
  `<svg viewBox="0 0 16 16" width="${s}" height="${s}" aria-hidden="true">${d}</svg>`;
const I = {
  plus: '<path d="M8 2.5v11M2.5 8h11"/>',
  x: '<path d="M3.8 3.8l8.4 8.4M12.2 3.8l-8.4 8.4"/>',
  up: '<path d="M3.5 9.5L8 5l4.5 4.5"/>',
  down: '<path d="M3.5 6.5L8 11l4.5-4.5"/>',
  left: '<path d="M9.5 3L5 8l4.5 5"/>',
  tick: '<path d="M3.5 8.4l3 3 6-6.8"/>',
  sun: '<circle cx="8" cy="8" r="3.1"/><path d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M3.1 3.1l1.1 1.1M11.8 11.8l1.1 1.1M12.9 3.1l-1.1 1.1M4.2 11.8l-1.1 1.1"/>',
  moon: '<path d="M13.2 9.8A5.8 5.8 0 0 1 6.2 2.8a5.8 5.8 0 1 0 7 7z"/>',
  sliders: '<path d="M2 5h3.2M8.8 5H14M2 11h6.2M11.8 11H14"/><circle cx="7" cy="5" r="1.8"/><circle cx="10" cy="11" r="1.8"/>',
};

/* Every scalar setting, by the dotted path the API and the YAML both use. */
const SETTINGS = ['lat', 'lon', 'cooldown', 'ntfy.priority',
  'source.poll_interval', 'db.refresh_interval', 'log_level'];

const PRIORITIES = [[0, 'muted'], [1, 'lowest'], [2, 'low'], [3, 'normal'],
  [4, 'high'], [5, 'highest']];
/* A rule with no priority follows ntfy.priority and has to keep following it: writing
   today's default into the rule would freeze it there the next time that default moves. */
const INHERIT = '';

/* Rows rendered per batch as a long picker list is scrolled. A couple of thousand tags
   built up front costs half a second; a screenful at a time costs nothing and drops
   nothing. */
const ROW_CHUNK = 150;

/* ── The conditions ────────────────────────────────────────────────────────
   Every condition is an optional filter of the same kind, ANDed with the rest;
   values inside one are ORed. They are grouped by the question they ask, which
   is also what decides whether the preview can answer them:

     db    the database row answers it, so it narrows the preview
     both  matched against the database and the live feed
     feed  only the live feed knows, so the preview is blind to it            */
const GROUPS = [
  {id: 'identity', label: 'Which aircraft it is',
   help: 'All of these must be true at once. Several values inside one condition mean “any of these”.'},
  {id: 'position', label: 'Where it is right now',
   help: 'Read from the live feed, and each fails closed: an aircraft that has not reported one does not match, rather than matching on a zero.'},
  {id: 'path', label: 'How it is flying',
   help: 'Read from the aircraft’s recent motion, held in memory only — a restart starts it again.'},
];

const CONDITIONS = [
  {key: 'cmpg', label: 'Operator class', group: 'identity', source: 'db', kind: 'fixed',
   options: [['Civ', 'Civilian'], ['Gov', 'Government'], ['Mil', 'Military'], ['Pol', 'Police']],
   help: 'Who operates the aircraft, as the database classifies it.'},
  {key: 'category', label: 'Category', group: 'identity', source: 'db', kind: 'pick',
   help: 'The database’s own interest lists — USAF, Heads of State, Police Forces, Aerial Firefighter and the rest.'},
  {key: 'tags', label: 'Tags', group: 'identity', source: 'db', kind: 'pick',
   help: 'Free-form labels: squadron names, nicknames, notable owners and passengers.'},
  {key: 'operator', label: 'Operator', group: 'identity', source: 'db', kind: 'pick',
   help: 'The airline, air force or owner on record.'},
  {key: 'type', label: 'Aircraft type', group: 'identity', source: 'db', kind: 'pick',
   help: 'The full type name, e.g. A-10 Thunderbolt II.'},
  {key: 'icao_type', label: 'ICAO type code', group: 'identity', source: 'both', kind: 'pick',
   open: true,
   help: 'The four-character code, e.g. A320 or C17. Matched against the database and the live feed, so a code no listed aircraft carries still alerts when one broadcasts it.'},
  {key: 'reg', label: 'Registration', group: 'identity', source: 'both', kind: 'free',
   help: 'Any tail number, e.g. N12345. Matched against the database and the live feed, so it never has to be a listed aircraft.'},
  {key: 'icao', label: 'ICAO hex address', group: 'identity', source: 'both', kind: 'free',
   help: 'The 24-bit address, e.g. adfdf8.'},
  {key: 'squawk', label: 'Squawk', short: 'the squawk', group: 'identity', source: 'feed', kind: 'free',
   quick: [['7700', '7700 — general emergency'], ['7600', '7600 — radio failure'],
           ['7500', '7500 — hijack']],
   help: 'The transponder code the aircraft is broadcasting right now.'},
  {key: 'listed', label: 'In the aircraft database', group: 'identity', source: 'db',
   kind: 'tri',
   options: [['', 'Either'], ['true', 'Only listed aircraft'], ['false', 'Only unlisted aircraft']],
   help: 'Whether plane-alert-db knows the aircraft at all. Every condition above already describes a listed aircraft, so this is worth stating on its own.'},

  {key: 'min_altitude_ft', label: 'Altitude at least', short: 'a minimum altitude',
   group: 'position', source: 'feed', kind: 'num', unit: 'ft', min: 0, integer: true},
  {key: 'max_altitude_ft', label: 'Altitude at most', short: 'a maximum altitude',
   group: 'position', source: 'feed', kind: 'num', unit: 'ft', min: 0, integer: true},
  {key: 'max_distance_nm', label: 'Within this far of the receiver',
   short: 'the distance from the receiver', group: 'position', source: 'feed', kind: 'num',
   unit: 'NM', min: 0, step: 'any', needsPosition: true},

  {key: 'circling', label: 'Circling', short: 'circling', group: 'path', source: 'feed', kind: 'tri',
   options: [['', 'Either'], ['true', 'Only while circling'], ['false', 'Only while not circling']],
   needsFastPoll: true,
   help: 'A full turn inside 2 NM during the last 10 minutes — how news and police helicopters fly.'},
  {key: 'passes_within_nm', label: 'Predicted to pass within', short: 'a predicted pass overhead',
   group: 'path', source: 'feed', kind: 'num', unit: 'NM', min: 0, step: 'any', needsPosition: true,
   help: 'Runs the current ground track and speed forward from the receiver’s position.'},
  {key: 'passes_within', label: '…within this long', short: 'how far ahead to predict',
   group: 'path', source: 'feed', kind: 'text', placeholder: '5m', requires: 'passes_within_nm',
   help: 'A duration like 5m or 30s. Defaults to 5m.'},
];
const BY_KEY = Object.fromEntries(CONDITIONS.map(c => [c.key, c]));
const PICKABLE = CONDITIONS.filter(c => c.kind === 'pick').map(c => c.key);
/* Values inside these are lists in the YAML; everything else holds one value. */
const LIST_KEYS = CONDITIONS.filter(c => c.kind === 'pick' || c.kind === 'free' || c.kind === 'fixed')
  .map(c => c.key);

/* ── State ────────────────────────────────────────────────────────────────
   `doc` is the alerts document exactly as it will be PUT back — nothing else is
   ever added to it, so saving is a serialisation and not a reconstruction.   */
let doc = null, vocab = {}, feedTypes = [], locks = {}, dbRows = null, alertsPath = '';
let sel = 0;            // rule index, or 'settings'
let dirty = false;

/* Everything the page knows about a rule that is not part of the rule itself: its last
   preview, the cooldown key the server computed for it, and which conditions are open in
   the editor. Keyed by the rule object rather than by position, so reordering and
   deleting carry it along with no bookkeeping, and a stale record cannot outlive the
   rule it described.

   `shown` is not the same question as "which conditions does this rule state". A
   condition added but not yet given a value is open in the editor and absent from the
   saved rule; conflating the two made a freshly added condition vanish the instant it
   was added. */
const RULE = new WeakMap();
function meta(r) {
  let m = RULE.get(r);
  if (!m) { m = {preview: null, key: '', savedKey: '', shown: new Set(stated(r))}; RULE.set(r, m); }
  return m;
}
const openKeys = r => CONDITIONS.filter(c => meta(r).shown.has(c.key)).map(c => c.key);

const isSettings = () => sel === 'settings';
const rule = () => doc.rules[sel];
const stated = r => CONDITIONS.map(c => c.key).filter(k => hasValue(r[k]));
const hasValue = v => Array.isArray(v) ? v.length > 0 : v !== undefined && v !== null && v !== '';

const at = (o, p) => p.split('.').reduce((v, k) => v?.[k], o);
const put = (o, p, v) => { const q = p.split('.'), k = q.pop();
  q.reduce((x, n) => x[n], o)[k] = v; };

/* ── Theme ────────────────────────────────────────────────────────────────
   Three states, not two: an explicit choice, or nothing at all and the system
   decides. Only a deliberate click is remembered.                           */
(function theme() {
  const KEY = 'sky-notify-theme';
  const btn = $('#theme');
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch {}
  const paint = t => {
    if (t) document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
    const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    btn.innerHTML = svg(dark ? I.sun : I.moon);
    btn.setAttribute('aria-label', dark ? 'Switch to light' : 'Switch to dark');
  };
  paint(saved);
  btn.onclick = () => {
    const now = document.documentElement.getAttribute('data-theme');
    const dark = now ? now === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    const next = dark ? 'light' : 'dark';
    try { localStorage.setItem(KEY, next); } catch {}
    paint(next);
  };
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (!document.documentElement.getAttribute('data-theme')) paint(null);
  });
})();

/* ── Saying what a rule does ──────────────────────────────────────────────
   A rule set is audited by reading down it, so each rule has to read back as a
   sentence. The YAML is the record; this is the thing you can scan.          */
function list(values, join = ' or ') {
  const v = values.map(String);
  if (v.length <= 2) return v.join(join);
  return v.slice(0, -1).join(', ') + join + v[v.length - 1];
}
const CLASS_WORDS = {civ: 'civilian', gov: 'government', mil: 'military', pol: 'police'};

function summarise(r) {
  const parts = [];
  const say = (k, fn) => { if (hasValue(r[k])) parts.push(fn(r[k])); };
  say('cmpg', v => list(v.map(x => CLASS_WORDS[String(x).toLowerCase()] || x)) + ' aircraft');
  say('category', v => 'in ' + list(v));
  say('tags', v => 'tagged ' + list(v));
  say('operator', v => 'flown by ' + list(v));
  say('type', v => list(v));
  say('icao_type', v => 'type code ' + list(v));
  say('reg', v => 'registered ' + list(v));
  say('icao', v => 'hex ' + list(v));
  say('squawk', v => 'squawking ' + list(v));
  if (r.listed === true) parts.push('listed in the database');
  if (r.listed === false) parts.push('not in the database');
  const lo = hasValue(r.min_altitude_ft), hi = hasValue(r.max_altitude_ft);
  if (lo && hi) parts.push(`between ${(+r.min_altitude_ft).toLocaleString()} and ${(+r.max_altitude_ft).toLocaleString()} ft`);
  else if (lo) parts.push(`above ${(+r.min_altitude_ft).toLocaleString()} ft`);
  else if (hi) parts.push(`below ${(+r.max_altitude_ft).toLocaleString()} ft`);
  say('max_distance_nm', v => `within ${v} NM of the receiver`);
  if (r.circling === true) parts.push('while circling');
  if (r.circling === false) parts.push('while not circling');
  say('passes_within_nm', v => `predicted to pass within ${v} NM in the next ` +
    (hasValue(r.passes_within) ? r.passes_within : '5m'));
  if (!parts.length) return 'Every aircraft — this rule states no condition.';
  return parts.join(', ').replace(/^./, c => c.toUpperCase()) + '.';
}

/* The cooldown key of an unnamed rule is a fingerprint of its conditions, computed by
   the server — Rule.Key in config.go — and carried back on both endpoints. The page
   never derives it: a key invented here would be a different string from the one the
   ledger and the logs actually use, which is worse than showing nothing. */
const ruleKey = r => meta(r).key;
const ruleLabel = r => r.name || ruleKey(r) || 'unlabelled';

/* ── What the preview can honestly say ────────────────────────────────────
   The preview searches the database, so a count is only a count when a database
   row could both narrow the rule and satisfy it. Left alone, a squawk-only rule
   would read as the whole database and a `listed: false` rule as zero — two lies
   dressed up as figures.                                                      */
function coverage(r) {
  const keys = stated(r);
  const p = meta(r).preview;
  if (!keys.length) return {kind: 'wild', figure: 'Every',
    note: 'This rule states no condition, so it matches every aircraft and no rule below it is ever reached.'};
  if (r.listed === false) {
    /* Nothing broadcasts an operator or a tag: those come off the database row, and
       this rule has just asked for aircraft that have no row. It can never match. */
    const owned = DB_ONLY.filter(k => hasValue(r[k]));
    if (owned.length) return {kind: 'dead', figure: '—',
      note: 'This rule asks for aircraft the database does not list, then asks for '
        + list(owned.map(k => BY_KEY[k].short || BY_KEY[k].label.toLowerCase()), ' and ')
        + ', which only a database row can answer. It will never alert.'};
    return {kind: 'blind', figure: '—',
      note: 'This rule matches only aircraft the database does not list, so there is nothing here to count. It alerts on what the feed brings.'};
  }
  if (!keys.some(k => BY_KEY[k].source !== 'feed')) return {kind: 'blind', figure: '—',
    note: 'Every condition here is read off the live feed, so the database has nothing to count. The rule alerts the moment an aircraft broadcasts a match.'};
  if (!p) return {kind: 'wait', figure: '…', note: 'Checking which aircraft this selects…'};
  if (p.error) return {kind: 'error', figure: '—', note: 'Could not preview this rule: ' + p.error};

  const feedToo = canMatchFeed(r);
  if (p.total === 0) return feedToo
    ? {kind: 'zero', figure: '0', note: 'No aircraft in the database — but this rule can still be satisfied from the live feed, so a zero here is inconclusive.'}
    : {kind: 'dead', figure: '0', note: 'No aircraft in the database can satisfy this rule, and nothing on the live feed can either. It will never alert.'};
  return {kind: 'count', figure: p.total.toLocaleString(),
    note: `of the ${(p.database ?? 0).toLocaleString()} aircraft in the database can satisfy this rule’s identity conditions.`};
}

/* A zero is inconclusive two different ways. reg and icao_type are matched against either
   source, so a rule narrowed by one can still catch an aircraft whose database row says
   otherwise. And unless a rule states something only a database row carries, it can match
   an aircraft with no row at all.

   The hex is not one of those: it is the key the database row is looked up by, so a hex
   the database has never heard of cannot arrive from the feed carrying another aircraft's
   row. A rule that pairs one with `listed: true`, or with anything only a row can answer,
   is dead rather than merely unpreviewable. */
const DB_ONLY = ['cmpg', 'category', 'tags', 'operator', 'type'];
const EITHER_SOURCE = ['reg', 'icao_type'];
function canMatchFeed(r) {
  if (EITHER_SOURCE.some(k => hasValue(r[k]))) return true;
  return r.listed !== true && !DB_ONLY.some(k => hasValue(r[k]));
}

/* Conditions the database cannot answer at all, named next to the figure so a rule that
   looks unnarrowed can be seen to be simply unpreviewable. */
const blindKeys = r => stated(r).filter(k => BY_KEY[k].source === 'feed');

/* ── Save-time problems, said before the save ─────────────────────────────
   The server validates the whole document and rejects all of it, so a rule that
   would be refused says so where it is built rather than at the bottom of the
   page after a failed write. */
function problem(r, key) {
  const spec = BY_KEY[key];
  /* The number fields are text inputs so they can keep a caret, which means they will
     also accept letters. The server would answer a decode error naming no field; this
     says which one, before the save and before the preview asks. */
  if (spec.kind === 'num' && hasValue(r[key]) && !Number.isFinite(Number(r[key])))
    return spec.integer ? 'Must be a whole number.' : 'Must be a number.';
  if (DB_ONLY.includes(key) && hasValue(r[key]) && r.listed === false)
    return 'Only a database row carries this, and this rule asks for aircraft that have no row, so it can never match. Remove this or the “not in the database” condition.';
  if (spec.needsPosition && hasValue(r[key]) && (setting('lat', doc.lat) == null || setting('lon', doc.lon) == null))
    return 'Needs the receiver’s latitude and longitude, which are not set. Open Settings to add them.';
  if (spec.needsFastPoll && r.circling === true) {
    const iv = setting('source.poll_interval', doc.source.poll_interval);
    const s = parseDuration(iv);
    if (s != null && s > 30)
      return `Needs the feeder polled every 30 seconds or less; it is currently ${iv}.`;
  }
  if (key === 'max_altitude_ft' && hasValue(r.min_altitude_ft) && hasValue(r.max_altitude_ft)
      && +r.max_altitude_ft <= +r.min_altitude_ft)
    return 'Must be above the lowest altitude, or no aircraft can be between the two.';
  if (key === 'passes_within' && hasValue(r.passes_within)) {
    /* Signed durations parse, so a negative one is a number rather than a refusal, and
       the server rejects it on a rule that would otherwise have looked fine here. */
    const ahead = parseDuration(r.passes_within);
    if (ahead === null) return 'Must be a duration like 5m or 30s.';
    if (ahead <= 0) return 'Must be longer than zero — the prediction needs a stretch of time to look ahead into.';
  }
  return null;
}
/* The environment overrides the file, and the server validates the overlay, so a check
   made against the file alone would call a rule invalid over a setting the file does not
   own. Anything locked reads from the environment; everything else reads live from the
   document being edited. */
function setting(key, fileValue) {
  return locks[key] ? locks[key].value : fileValue;
}

/* Go's duration syntax, which is what the server parses these with, down to the corners:
   an optional sign, then one or more number-unit pairs where the number may lead or
   trail its point. So 1m30s, .5m, 1.m and +1m all parse, and only a bare 0 goes
   without a unit. Verified case by case against time.ParseDuration. */
const DUR_UNIT = {ns: 1e-9, us: 1e-6, 'µs': 1e-6, ms: .001, s: 1, m: 60, h: 3600};
function parseDuration(v) {
  let t = String(v ?? '').trim();
  const sign = t[0] === '-' ? -1 : 1;
  if (t[0] === '+' || t[0] === '-') t = t.slice(1);
  if (t === '0') return 0;
  const re = /(\d+\.?\d*|\.\d+)(ns|us|µs|ms|s|m|h)/y;
  /* A sticky regex resets lastIndex when it finally fails, so the end of the last
     match is kept: the whole string must be pairs, or this is not a duration. */
  let total = 0, end = 0, m;
  while ((m = re.exec(t))) { total += +m[1] * DUR_UNIT[m[2]]; end = re.lastIndex; }
  return t && end === t.length ? sign * total : null;
}

/* ── Messages ─────────────────────────────────────────────────────────── */
let msgTimer = null;
function message(text, kind) {
  const m = $('#msg');
  clearTimeout(msgTimer);
  if (!text) { m.hidden = true; return; }
  m.textContent = text;
  m.className = 'msg ' + kind;
  m.hidden = false;
  if (kind === 'good') msgTimer = setTimeout(() => { m.hidden = true; }, 4000);
}

function markDirty() {
  dirty = true;
  const b = $('#save');
  b.disabled = false;
  b.classList.remove('done');
  b.textContent = 'Save';
}

/* ── Popover ──────────────────────────────────────────────────────────────
   One at a time, closed by Escape, a click outside, or committing a value.   */
let closePop = null;
function popover(anchor, build) {
  closePop?.();
  const scrim = el('div', 'scrim'), pop = el('div', 'pop');
  const done = () => { pop.remove(); scrim.remove(); closePop = null;
    document.removeEventListener('keydown', onKey); anchor.focus(); };
  const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); done(); } };
  scrim.onclick = done;
  document.addEventListener('keydown', onKey);
  closePop = done;
  build(pop, done);
  document.body.append(scrim, pop);
  place(pop, anchor);
  pop.querySelector('input')?.focus();
}
function place(pop, anchor) {
  const r = anchor.getBoundingClientRect();
  const w = pop.offsetWidth, h = pop.offsetHeight;
  pop.style.left = Math.max(12, Math.min(r.left, innerWidth - w - 12)) + 'px';
  pop.style.top = (r.bottom + h + 12 <= innerHeight ? r.bottom + 6
    : Math.max(12, r.top - h - 6)) + 'px';
}

/* ── The value picker ─────────────────────────────────────────────────────
   A native <datalist> cannot cope with this: at a couple of thousand tags the
   browser silently truncates its popup, so you cannot tell whether what you
   want is missing or merely out of view. This filters, ranks prefix matches
   first, counts what it left out, and renders in batches as you scroll.

   The pool is the rule's own facets — the values still reachable given its
   other conditions — falling back to the whole vocabulary before the first
   preview has returned.                                                      */
function valuePicker(anchor, r, key, after) {
  const spec = BY_KEY[key];
  popover(anchor, pop => {
    const head = el('div', 'pop-h');
    head.append(el('div', 'lbl', spec.label));
    const q = el('input'); q.type = 'text'; q.autocomplete = 'off';
    q.placeholder = spec.open ? 'Search, or type any code and press Enter' : 'Search…';
    q.setAttribute('aria-label', 'Search ' + spec.label.toLowerCase());
    head.append(q);
    pop.append(head);
    const listEl = el('div', 'pop-l');
    pop.append(listEl);

    /* aircraft.json carries a type code for every aircraft overhead, listed or not, so
       the type picker is not the database's to bound: whatever the receiver has heard is
       offered beside it, marked, and the database's own count is kept where both know a
       code. Every other field is a database column and has nothing to fold in. */
    const extra = key === 'icao_type' ? feedTypes : [];
    const known = new Set((vocab[key] || []).map(v => v.value.toLowerCase()));
    const dbPool = () => meta(r).preview?.facets?.[key] || vocab[key] || [];
    /* A code the pool above does not reach is out for one of two reasons, and they are
       not the same thing to say: the database has never heard of it, or it has but no
       aircraft matching this rule's other conditions carries it. inDb keeps them apart. */
    const pool = () => {
      const db = dbPool();
      if (!extra.length) return db;
      const have = new Set(db.map(v => v.value.toLowerCase()));
      return db.concat(extra.filter(v => !have.has(v.value.toLowerCase()))
                            .map(v => ({...v, feed: true, inDb: known.has(v.value.toLowerCase())})));
    };
    const narrowed = () => dbPool().length < (vocab[key] || []).length;
    let shown = [], rendered = 0, active = -1, body = null;

    const candidates = () => {
      const term = q.value.trim().toLowerCase();
      const chosen = new Set((r[key] || []).map(v => String(v).toLowerCase()));
      const starts = [], contains = [];
      for (const item of pool()) {
        const lv = item.value.toLowerCase();
        if (chosen.has(lv)) continue;
        if (!term) { starts.push(item); continue; }
        const at = lv.indexOf(term);
        if (at === 0) starts.push(item); else if (at > 0) contains.push(item);
      }
      return starts.concat(contains);
    };

    const grow = upTo => {
      const want = Math.min(shown.length, Math.max(rendered + ROW_CHUNK, (upTo ?? -1) + 1));
      if (want <= rendered || !body) return;
      const batch = document.createDocumentFragment();
      for (let n = rendered; n < want; n++) {
        const item = shown[n];
        const b = el('button', 'opt'); b.type = 'button'; b.dataset.i = n;
        const box = el('span', 'box'); box.innerHTML = svg(I.tick, 10);
        b.append(box, el('span', 't', item.value),
          el('span', 'n', item.feed ? item.count.toLocaleString() + ' on your feed'
                                    : item.count.toLocaleString()));
        if (item.feed) b.title = item.inDb
          ? 'No aircraft matching this rule’s other conditions carries this code in the '
            + 'database; your receiver has heard it.'
          : 'No aircraft in the database carries this code; your receiver has heard it.';
        batch.append(b);
      }
      body.append(batch);
      rendered = want;
    };

    const paint = () => {
      for (const b of body.querySelectorAll('.opt.active')) b.classList.remove('active');
      const node = active >= 0 ? body.children[active] : null;
      if (node) { node.classList.add('active'); node.scrollIntoView({block: 'nearest'}); }
    };

    const draw = () => {
      shown = candidates(); rendered = 0; active = -1;
      body = el('div');
      /* Two handlers on the container rather than two per row: at a couple of
         thousand rows the per-row closures cost more than the rows. mousedown,
         not click — blur would close the popover before a click landed. */
      body.onmousedown = e => {
        const b = e.target.closest('.opt'); if (!b) return;
        e.preventDefault(); commit(shown[+b.dataset.i].value);
      };
      body.onmouseover = e => {
        const b = e.target.closest('.opt'); if (!b) return;
        active = +b.dataset.i; paint();
      };
      grow();
      const scope = narrowed() ? ' matching this rule’s other conditions' : '';
      const note = el('div', 'pop-note');
      if (!shown.length) note.textContent = q.value.trim()
        ? (spec.open
          ? 'Nothing in the database or on your feed matches that. Press Enter to use it anyway — an aircraft may still broadcast it.'
          : 'No value matching that' + (scope || ' in the database') + '.')
        : 'Everything reachable here is already selected.';
      else note.textContent = `${shown.length.toLocaleString()} ` +
        `${shown.length === 1 ? 'value' : 'values'}${scope}, with how many aircraft each covers.` +
        (extra.length ? ' Codes your receiver has heard are listed too.' : '');
      listEl.replaceChildren(note, body);
      listEl.scrollTop = 0;
    };

    const commit = value => {
      const v = String(value).trim();
      if (v && !(r[key] || []).some(x => String(x) === v)) r[key] = [...(r[key] || []), v];
      q.value = '';
      after();
      draw();
    };

    listEl.onscroll = () => {
      if (listEl.scrollTop + listEl.clientHeight > listEl.scrollHeight - 320) grow();
    };
    q.oninput = draw;
    q.onkeydown = e => {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        active = Math.min(shown.length - 1, Math.max(0, active + (e.key === 'ArrowDown' ? 1 : -1)));
        if (active >= rendered) grow(active);
        paint();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        /* Only commit something the database has, so a half-typed search cannot
           become a value that matches nothing. An open field is the exception:
           there the live feed is the other half of the world. */
        if (active >= 0) commit(shown[active].value);
        else if (spec.open) commit(q.value);
        else {
          const hit = pool().find(v => v.value.toLowerCase() === q.value.trim().toLowerCase());
          if (hit) commit(hit.value);
        }
      }
    };
    draw();
  });
}

/* A field with no database vocabulary to suggest from: anything typed is valid,
   because the live feed is the only thing that can answer it. */
function freePicker(anchor, r, key, after) {
  const spec = BY_KEY[key];
  popover(anchor, pop => {
    const head = el('div', 'pop-h');
    head.append(el('div', 'lbl', spec.label));
    const q = el('input'); q.type = 'text'; q.autocomplete = 'off';
    q.placeholder = 'Type a value and press Enter';
    q.setAttribute('aria-label', spec.label);
    head.append(q);
    pop.append(head);
    const listEl = el('div', 'pop-l');
    pop.append(listEl);
    const draw = () => {
      listEl.replaceChildren();
      if (!spec.quick) { listEl.append(el('div', 'pop-e', spec.help || '')); return; }
      const chosen = new Set((r[key] || []).map(v => String(v).toLowerCase()));
      for (const [v, text] of spec.quick) {
        const on = chosen.has(v.toLowerCase());
        const b = el('button', 'opt' + (on ? ' on' : '')); b.type = 'button';
        const box = el('span', 'box'); box.innerHTML = svg(I.tick, 10);
        b.append(box, el('span', 't', text));
        b.onclick = () => {
          r[key] = on ? (r[key] || []).filter(x => String(x).toLowerCase() !== v.toLowerCase())
                      : [...(r[key] || []), v];
          after(); draw();
        };
        listEl.append(b);
      }
    };
    q.onkeydown = e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const v = q.value.trim();
      if (!v || (r[key] || []).some(x => String(x) === v)) { q.value = ''; return; }
      r[key] = [...(r[key] || []), v];
      q.value = ''; after(); draw();
    };
    draw();
  });
}

/* The condition menu only offers what this rule is not already using, grouped by
   the question each condition asks. */
function conditionPicker(anchor, r, groupId, after) {
  popover(anchor, (pop, done) => {
    const head = el('div', 'pop-h');
    head.append(el('div', 'lbl', 'Add a condition'));
    pop.append(head);
    const listEl = el('div', 'pop-l');
    pop.append(listEl);
    const open = meta(r).shown;
    const items = CONDITIONS.filter(c => c.group === groupId && !open.has(c.key)
      && (!c.requires || open.has(c.requires)));
    for (const c of items) {
      const b = el('button', 'opt'); b.type = 'button';
      const t = el('span', 't', c.label);
      if (c.source !== 'db') t.append(el('small', '', c.source === 'feed'
        ? 'Live feed only — narrows what is overhead, not the database figure'
        : 'Matched against the database and the live feed'));
      b.append(t);
      b.onclick = () => {
        /* An added condition starts empty and states nothing until it is given a
           value: a blank one contributes nothing to the saved rule. `tri` is the
           exception — it has no empty state that means anything, so it starts at
           the choice most people want. */
        r[c.key] = c.kind === 'tri' ? true : c.kind === 'num' || c.kind === 'text' ? '' : [];
        open.add(c.key);
        done(); after(c.key);
      };
      listEl.append(b);
    }
    if (!items.length) listEl.append(el('div', 'pop-e',
      'Every condition in this group is already on this rule.'));
  });
}

/* ── One condition ────────────────────────────────────────────────────── */
function conditionCard(r, key) {
  const spec = BY_KEY[key];
  const bad = problem(r, key);
  const card = el('div', 'cond' + (bad ? ' bad' : spec.source === 'feed' ? ' blind' : ''));

  const head = el('div', 'cond-h');
  head.append(el('span', 'lbl', spec.label));
  const drop = el('button', 'x'); drop.type = 'button';
  drop.innerHTML = svg(I.x, 13);
  drop.setAttribute('aria-label', 'Remove the ' + spec.label.toLowerCase() + ' condition');
  drop.onclick = () => {
    delete r[key];
    meta(r).shown.delete(key);
    /* passes_within is meaningless without the distance it qualifies, and the
       server rejects the pair, so it leaves with it. */
    if (key === 'passes_within_nm') { delete r.passes_within; meta(r).shown.delete('passes_within'); }
    markDirty(); schedulePreview(r); renderPane(); renderList();
  };
  head.append(drop);
  card.append(head);

  if (spec.kind === 'num' || spec.kind === 'text') {
    const row = el('div', 'numrow');
    const input = el('input');
    input.id = 'c-' + key;
    /* Text, not number, even for the numbers: only a text input will report or accept a
       caret position, and a preview answer landing mid-edit has to be able to put the
       caret back where it was. inputmode still asks a phone for the numeric keypad, and
       the spinner arrows are no loss on a field like "within 15 NM". */
    input.type = 'text';
    if (spec.kind === 'num') {
      input.className = 'num';
      input.inputMode = spec.integer ? 'numeric' : 'decimal';
    }
    if (spec.placeholder) input.placeholder = spec.placeholder;
    input.value = r[key] ?? '';
    input.setAttribute('aria-label', spec.label);
    /* Typing must not rebuild the pane — the caret would jump. Only the figure,
       the sentence and the list row move until the next structural change. */
    input.oninput = () => {
      const n = Number(input.value);
      r[key] = input.value === '' ? ''
        : spec.kind !== 'num' ? input.value
        /* A number field now accepts any keystroke, so what is not a number is held as
           typed rather than written to the rule as NaN. The server would reject it, and
           so does the figure above, which stops counting the moment it stops parsing. */
        : !Number.isFinite(n) ? input.value
        : spec.integer ? Math.round(n) : n;
      markDirty(); schedulePreview(r); refreshFigures();
    };
    row.append(input);
    if (spec.unit) row.append(el('span', 'unit lbl', spec.unit));
    card.append(row);
  } else if (spec.kind === 'tri') {
    const s = el('select');
    s.id = 'c-' + key;
    for (const [v, t] of spec.options) s.append(new Option(t, v));
    s.value = r[key] === undefined || r[key] === null ? '' : String(r[key]);
    s.setAttribute('aria-label', spec.label);
    s.onchange = () => {
      if (s.value === '') delete r[key]; else r[key] = s.value === 'true';
      markDirty(); schedulePreview(r); renderPane(); renderList();
    };
    card.append(s);
  } else if (spec.kind === 'fixed') {
    const vals = el('div', 'vals');
    for (const [v, t] of spec.options) {
      const on = (r[key] || []).some(x => String(x).toLowerCase() === v.toLowerCase());
      const b = el('button', 'chip toggle'); b.type = 'button';
      b.setAttribute('aria-pressed', String(on));
      b.append(el('span', 'v', t));
      b.onclick = () => {
        r[key] = on ? (r[key] || []).filter(x => String(x).toLowerCase() !== v.toLowerCase())
                    : [...(r[key] || []), v];
        markDirty(); schedulePreview(r); renderPane(); renderList();
      };
      vals.append(b);
    }
    card.append(vals);
  } else {
    card.append(valueChips(r, key));
  }

  if (bad) card.append(el('p', 'help bad', bad));
  /* Plain rather than a warning: the figure above cannot see this condition, but the
     roll call of what is overhead does apply it, so it is a limit of the figure and no
     longer a blind spot in the rule. */
  else if (spec.source === 'feed') card.append(el('p', 'help',
    (spec.group === 'identity'
      ? 'Read off the live feed. No database row can answer it, so it does not narrow the figure above'
      : spec.group === 'position'
        ? 'Describes where the aircraft is, not which aircraft it is, so it does not narrow the figure above'
        : 'Describes how the aircraft is flying, so it does not narrow the figure above')
    + ' — only what is overhead right now, further down.'));
  else if (spec.source === 'both') card.append(el('p', 'help',
    'Matched against the database and the live feed, so a value no listed aircraft carries still alerts when one broadcasts it.'));
  if (spec.help && !bad) card.append(el('p', 'help', spec.help));
  return card;
}

/* The chips for a list-valued condition, plus the button that adds another.
   Two different ways a value can cost you every alert it was meant to catch:
   one the database has never heard of, and a real one that no aircraft matching
   this rule's OTHER conditions carries. Both look fine in the YAML. */
function valueChips(r, key) {
  const spec = BY_KEY[key];
  const vals = el('div', 'vals');
  const known = new Set((vocab[key] || []).map(v => v.value.toLowerCase()));
  const heard = new Map(key === 'icao_type'
    ? feedTypes.map(v => [v.value.toLowerCase(), v.count]) : []);
  const facets = meta(r).preview?.facets?.[key];
  const reach = facets && new Map(facets.map(v => [v.value.toLowerCase(), v.count]));

  for (const raw of r[key] || []) {
    const v = String(raw), low = v.toLowerCase();
    const chip = el('span', 'chip');
    chip.append(el('span', 'v', v));
    if (spec.kind === 'pick') {
      const count = reach?.get(low);
      if (count !== undefined) {
        chip.append(el('span', 'n', count.toLocaleString()));
      } else if (!known.has(low)) {
        /* On a closed field the database is the whole world, so a value it has never
           heard of can only be a typo. On an open field the live feed is the other
           half of that world, and flagging it red would be a lie. */
        chip.classList.add(spec.open ? 'feed' : 'miss');
        chip.append(el('span', 'n', !spec.open ? 'not found'
          : heard.has(low) ? heard.get(low).toLocaleString() + ' on your feed' : 'feed only'));
        chip.title = spec.open
          ? 'No aircraft in the database carries this code. It still alerts on any aircraft broadcasting it on the live feed.'
          : 'Not found in the aircraft database — this value will never match.';
      } else if (reach) {
        chip.classList.add(spec.open ? 'feed' : 'miss');
        chip.append(el('span', 'n', 'clashes'));
        chip.title = spec.open
          ? 'No aircraft matching this rule’s other conditions has this value in the database, so only a live-feed match can satisfy this rule.'
          : 'No aircraft matching this rule’s other conditions has this value, so the rule matches nothing. Remove this or the condition that clashes with it.';
      }
    }
    const drop = el('button'); drop.type = 'button';
    drop.innerHTML = svg(I.x, 10);
    drop.setAttribute('aria-label', 'Remove ' + v);
    drop.onclick = () => {
      r[key] = (r[key] || []).filter(x => String(x) !== v);
      markDirty(); schedulePreview(r); renderPane(); renderList();
    };
    chip.append(drop);
    vals.append(chip);
  }

  const add = el('button', 'mini', (r[key] || []).length ? 'Add another' : 'Choose a value');
  add.type = 'button';
  const after = () => { markDirty(); schedulePreview(r); renderPane(); renderList(); };
  add.onclick = () => (spec.kind === 'free' ? freePicker(add, r, key, after)
                                            : valuePicker(add, r, key, after));
  vals.append(add);
  return vals;
}

/* ── The rule list ────────────────────────────────────────────────────── */
/* Dragging reorders the rules in place. The up/down buttons on the pane stay: a keyboard
   reader cannot drag, and the same move has to be reachable without a pointer. */
let dragEl = null;
function dragHandlers(box) {
  box.ondragstart = e => {
    const row = e.target.closest('.row');
    if (!row) return;
    dragEl = row;
    row.classList.add('drag');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', row.dataset.i);   // Firefox drags nothing without it
  };
  /* The row is moved in the DOM as it is dragged rather than re-rendered: a rebuild would
     destroy the element being dragged and the browser would abort the drag with it. The
     array is only touched once, on drop, from where the row actually came to rest. */
  box.ondragover = e => {
    if (!dragEl) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const row = e.target.closest('.row');
    if (!row || row === dragEl) return;
    const box2 = row.getBoundingClientRect();
    box.insertBefore(dragEl, e.clientY > box2.top + box2.height / 2 ? row.nextSibling : row);
  };
  box.ondrop = e => { e.preventDefault(); dropped(box); };
  /* Only a drop commits. A drag called off — Escape, or released outside the list — still
     ends here, with the row sitting where it was dragged to and the array never touched;
     rebuilding from the array is what puts it back. A drop has already cleared dragEl. */

  dragEl.classList.remove('drag');

  if (to < 0 || to === from) return renderList();
  const [moved] = doc.rules.splice(from, 1);
  doc.rules.splice(to, 0, moved);
  if (sel === from) sel = to;
  else if (typeof sel === 'number') {
    if (from < sel && to >= sel) sel--;
    else if (from > sel && to <= sel) sel++;

  markDirty(); renderList(); renderPane();
}

function renderList() {
  /* A preview answer landing mid-drag would replace the row under the cursor. */
  if (dragEl) return;
  const box = $('#rows');
  dragHandlers(box);
  const hadFocus = document.activeElement?.closest?.('.row');
  const focusIndex = hadFocus ? [...box.children].indexOf(hadFocus) : -1;
  box.replaceChildren();

  let shadowed = false;
  doc.rules.forEach((r, i) => {
    const cov = coverage(r);
    const b = el('button', 'row' + (shadowed ? ' shadowed' : ''));
    b.type = 'button';
    b.draggable = true;
    b.dataset.i = i;
    b.setAttribute('aria-current', String(sel === i));
    b.onclick = () => select(i);
    b.append(el('span', 'n', String(i + 1)));

    const mid = el('span');
    const name = el('span', 'r-name' + (r.name ? '' : ' anon'), ruleLabel(r));
    mid.append(name);
    mid.append(el('span', 'r-sub', shadowed
      ? 'Never reached — a rule above matches every aircraft.'
      : summarise(r)));
    b.append(mid);

    const cls = {wild: 'wild', blind: 'blind', dead: 'dead', zero: 'blind',
                 wait: 'wait', error: 'dead'}[cov.kind] || '';
    b.append(el('span', 'badge ' + cls, cov.kind === 'wild' ? 'all' : cov.figure));
    box.append(b);
    if (cov.kind === 'wild') shadowed = true;
  });

  if (!doc.rules.length) {
    const p = el('div', 'pop-e');
    p.textContent = 'No rules yet. Nothing will alert you until there is one — a rule is an allowlist, and with none there is nothing to match.';
    box.append(p);
  }

  $('#settings').setAttribute('aria-pressed', String(isSettings()));

  if (focusIndex >= 0 && box.children[focusIndex]) box.children[focusIndex].focus();
}

function select(next) {
  sel = next;
  document.body.dataset.view = 'detail';
  renderList();
  renderPane();
  if (innerWidth <= 900) scrollTo({top: 0, behavior: 'smooth'});
}

/* ── The detail pane ──────────────────────────────────────────────────────
   A preview answer can arrive while the pane is being used, and a rebuild is the only
   render this page has. So the two things a rebuild costs are put back: the caret, or a
   slow answer takes the field out from under a half-typed number, and the scroll
   position, or reaching further down a list of matches throws you to the top.        */
function renderPane() {
  const pane = $('#pane');
  const had = document.activeElement;
  const id = pane.contains(had) && had.id ? had.id : null;
  const text = id && had.type === 'text';          // a select reports no caret
  const caret = text ? [had.selectionStart, had.selectionEnd] : null;
  const raw = text ? had.value : null;
  const y = scrollY;
  /* The table of matches scrolls inside its own box — vertically through the rows, and
     horizontally at phone width. Neither is the window's scroll, and both are where the
     operator was looking, and there are two of them. */
  const boxes = [...pane.querySelectorAll('.hits')].map(b => [b.scrollTop, b.scrollLeft]);
  paintPane(pane);
  const back = id && document.getElementById(id);
  if (back) {
    /* "1." and "1" are the same number but not the same half-typed value, and the rebuild
       reads the number. Only ever put back a string that means what is already there:
       anything else and the pane is showing a different rule, where it does not belong. */
    if (raw !== null && back.value !== raw && Number(back.value) === Number(raw)) back.value = raw;
    /* preventScroll: bringing the element into view is the browser scrolling every box
       between it and the window, which is every position this function is restoring. */
    back.focus({preventScroll: true});
    if (caret) back.setSelectionRange(caret[0], caret[1]);
  }
  /* After the focus, so that the focus cannot have moved either of them. */
  pane.querySelectorAll('.hits').forEach((b, i) => {
    if (boxes[i]) [b.scrollTop, b.scrollLeft] = boxes[i];
  });
  if (scrollY !== y) scrollTo(0, y);
}

function paintPane(pane) {
  pane.replaceChildren();
  if (isSettings()) return renderSettings(pane);

  if (!doc.rules.length) {
    const e = el('div', 'empty');
    e.append(el('h2', '', 'No rules'));
    e.append(el('p', 'help', 'sky-notify stays silent until a rule matches something — emergency squawks included. Add one to start.'));
    const b = el('button', 'btn primary', 'Add a rule'); b.type = 'button';
    b.onclick = addRule;
    e.append(b);
    pane.append(e);
    return;
  }

  if (sel > doc.rules.length - 1) sel = doc.rules.length - 1;
  const r = rule(), i = sel;
  const cov = coverage(r);
  const shadowed = doc.rules.slice(0, i).some(x => stated(x).length === 0);

  /* header */
  const head = el('div', 'pane-h');
  const back = el('button', 'btn icon back');
  back.innerHTML = svg(I.left, 15);
  back.setAttribute('aria-label', 'Back to the rule list');
  back.onclick = () => { document.body.dataset.view = 'list'; };
  head.append(back);
  head.append(el('h2', r.name ? '' : 'anon', ruleLabel(r)));
  const move = (icon, delta, label) => {
    const b = el('button', 'btn icon');
    b.innerHTML = svg(icon, 15);
    b.setAttribute('aria-label', label);
    b.disabled = i + delta < 0 || i + delta >= doc.rules.length;
    b.onclick = () => {
      const [moved] = doc.rules.splice(i, 1);
      doc.rules.splice(i + delta, 0, moved);
      sel = i + delta;
      markDirty(); renderList(); renderPane();
    };
    return b;
  };
  head.append(move(I.up, -1, 'Move this rule earlier'), move(I.down, 1, 'Move this rule later'));
  pane.append(head);

  if (shadowed) {
    const w = el('div', 'group');
    w.append(el('p', 'help warn', 'This rule is never reached. A rule above it states no condition, so it matches every aircraft and evaluation stops there.'));
    pane.append(w);
  }

  pane.append(resultBand(r, cov));

  /* conditions, grouped by the question they ask */
  for (const g of GROUPS) {
    const keys = openKeys(r).filter(k => BY_KEY[k].group === g.id);
    const sec = el('div', 'group');
    const gh = el('div', 'group-h');
    const t = el('div', 'group-t');
    t.append(el('h3', 'lbl', g.label));
    t.append(el('p', 'help', g.help));
    gh.append(t);
    const add = el('button', 'mini', 'Add condition'); add.type = 'button';
    add.onclick = () => conditionPicker(add, r, g.id, () => {
      markDirty(); schedulePreview(r); renderPane(); renderList();
    });
    gh.append(add);
    sec.append(gh);
    for (const k of keys) sec.append(conditionCard(r, k));
    if (!keys.length) sec.append(el('p', 'help',
      g.id === 'identity'
        ? 'None stated. With none anywhere, this rule matches every aircraft.'
        : 'None stated.'));
    pane.append(sec);
  }

  const live = liveBand(r);
  if (live) pane.append(live);

  const hits = hitsBand(r, cov);
  if (hits) pane.append(hits);

  pane.append(historyBand(r));
  /* Fetched when the band is first drawn rather than when the page loads: history is
     read one rule at a time, and previewing every rule on arrival is already enough
     work for a page that has just opened. */
  if (meta(r).savedKey && !meta(r).history) loadHistory(r);

  pane.append(labelBand(r, i));
}

function resultBand(r, cov) {
  const band = el('div', 'result');
  const top = el('div', 'result-top');
  const big = el('div', 'big', cov.figure);
  if (cov.kind === 'dead' || cov.kind === 'error') big.classList.add('dead');
  if (cov.kind === 'wild') big.classList.add('wild');
  top.append(big);
  top.append(el('p', cov.kind === 'dead' || cov.kind === 'error' ? 'dead' : '', cov.note));
  band.append(top);

  const blind = blindKeys(r);
  if (blind.length && cov.kind !== 'blind' && cov.kind !== 'wild') {
    band.append(el('p', 'help', 'Not counted above: '
      + list(blind.map(k => BY_KEY[k].short || BY_KEY[k].label.toLowerCase()), ' and ')
      + ` — the database has no answer for ${blind.length > 1 ? 'those' : 'that'}, so ${blind.length > 1 ? 'they narrow' : 'it narrows'} what is overhead right now, further down, and not this figure.`));
  }

  return band;
}

/* ── Overhead right now ───────────────────────────────────────────────────
   The database band answers what a rule can ever select. This one answers the question
   actually being asked while a rule is written: if I saved this, what would it alert on?
   So it runs against the last poll with every condition applied — altitude, distance and
   flight path included, none of which the database can answer.

   It is shown for every rule, including the ones the database cannot preview at all: a
   squawk- or altitude-only rule has no figure above it and this is the only check it
   gets. */
/* How old the poll behind an answer is by now: as old as it was when the server said so,
   plus however long the answer has been sitting on screen. A cached `fresh` cannot be
   trusted on its own — a feeder that stops after an answer lands would go on reading as
   an empty sky, which is the one thing this band must never say. Stale by the same rule
   /healthz uses, mirrored here so it can be applied without asking again. */
function liveAge(r) {
  const m = meta(r), L = m.preview?.live;
  if (!L || L.age_s == null || !m.at) return null;
  return L.age_s + (Date.now() - m.at) / 1000;
}
function liveFresh(r) {
  const L = meta(r).preview?.live;

  const age = liveAge(r), poll = pollEvery();
  if (age == null) return true;
  /* Never call the sky stale sooner than the page is allowed to ask again, or a very
     short poll interval spends half its time warning about an answer it has not been
     permitted to fetch yet. */
  return age <= Math.max(poll * 3, liveEvery() + poll);
}
const pollEvery = () => parseDuration(setting('source.poll_interval', doc.source.poll_interval)) || 15;

function liveBand(r) {
  const p = meta(r).preview;
  const L = p && !p.error && p.live;
  if (!L) return null;

  const sec = el('div', 'group');
  const gh = el('div', 'group-h');
  const t = el('div', 'group-t');
  t.append(el('h3', 'lbl', 'Overhead right now'));
  t.append(el('p', 'help', 'The last poll, matched on the whole rule — where the aircraft is and how it is flying, not only who it is.'));
  gh.append(t);
  sec.append(gh);

  /* What the band is currently claiming, so the ticker can notice the claim expiring
     without an answer having to arrive to tell it. */
  meta(r).shownFresh = liveFresh(r);
  if (!meta(r).shownFresh) {
    sec.append(el('p', 'help warn', 'No fresh poll from the feeder, so there is nothing to check this rule against. A zero here would not mean an empty sky.'));
    return sec;
  }
  const overhead = `${(L.overhead || 0).toLocaleString()} aircraft overhead`;
  if (!L.total) {
    sec.append(el('p', 'help', `None of the ${overhead} match this rule as things stand. That is the normal state for a rule worth having — it says nothing about whether the rule works.`));
    return sec;
  }
  /* Muted is a real answer to "would this alert", not a detail: the rule matches and
     sends nothing. Said here rather than only next to the priority field, because this
     is the band that claims an alert. */
  const muted = r.priority === 0;
  sec.append(el('p', 'help' + (muted ? ' warn' : ''),
    `${L.total.toLocaleString()} of the ${overhead} `
    + (muted ? 'match this rule, but it is muted and would send nothing.'
             : `would alert the moment this rule is saved${L.total > L.aircraft.length ? `; the nearest ${L.aircraft.length} are listed` : ''}.`)));
