<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Sign in · Sky Notify</title>
<style>
/* The same font and tokens as ui.html, cut down to what this page uses. */
@font-face{font-family:'Public Sans';font-style:normal;font-weight:400 700;font-display:swap;
  src:url(public-sans.woff2) format('woff2')}
:root{
  --bg:#F5F6F9; --panel:#FFF; --line:#E1E4EB; --line2:#C9D0DA;
  --fg:#12161C; --fg2:#57616F; --acc:#2B55C8; --acc-fg:#FFF;
  --bad:#A8261E; --bad-soft:#FCEBE9; --bad-line:#EDB9B4;
  --sh2:0 10px 28px -12px rgba(18,22,28,.34), 0 2px 6px -2px rgba(18,22,28,.14);
  --r:9px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0C0F13; --panel:#151A20; --line:#262D36; --line2:#39424E;
  --fg:#E7ECF2; --fg2:#98A3B1; --acc:#88A6FF; --acc-fg:#0C0F13;
  --bad:#F09189; --bad-soft:#2B1817; --bad-line:#4D2723;
  --sh2:0 12px 30px -14px #000, 0 2px 8px -3px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme=dark]{
  --bg:#0C0F13; --panel:#151A20; --line:#262D36; --line2:#39424E;
  --fg:#E7ECF2; --fg2:#98A3B1; --acc:#88A6FF; --acc-fg:#0C0F13;
  --bad:#F09189; --bad-soft:#2B1817; --bad-line:#4D2723;
  --sh2:0 12px 30px -14px #000, 0 2px 8px -3px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;
  background:var(--bg);color:var(--fg);
  font:400 14.5px/1.55 'Public Sans',system-ui,-apple-system,Segoe UI,sans-serif}
form{width:100%;max-width:340px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--sh2);padding:26px 24px;display:grid;gap:14px}
h1{margin:0 0 4px;font-size:18px;font-weight:600;letter-spacing:-.02em}
label{font-size:11.5px;font-weight:650;letter-spacing:.055em;text-transform:uppercase;color:var(--fg2)}
input{font:inherit;color:inherit;width:100%;margin-top:6px;padding:9px 11px;
  background:var(--bg);border:1px solid var(--line2);border-radius:var(--r)}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button{font:inherit;font-weight:600;cursor:pointer;padding:9px 13px;border:0;
  border-radius:var(--r);background:var(--acc);color:var(--acc-fg)}
button:hover{filter:brightness(1.1)}
.err{margin:0;font-size:13px;color:var(--bad);background:var(--bad-soft);
  border:1px solid var(--bad-line);border-radius:6px;padding:8px 10px}
</style>
<script>
/* Follow the theme the main page remembered. */
try { const t = localStorage.getItem('sky-notify-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
</script>
<form method="post" action="/login">
  <h1>Sky Notify</h1>
  <!--error-->
  <label>Password
    <input type="password" name="password" autocomplete="current-password" required autofocus>
  </label>
  <button type="submit">Sign in</button>
</form>
