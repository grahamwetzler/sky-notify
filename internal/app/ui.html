<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>sky-notify</title>
<style>
/* Public Sans, latin subset, variable 400-700. Served by the binary alongside this page,
   not fetched from a CDN: the network this runs on need not have internet access, and a
   font that silently falls back is a different design. SIL Open Font License 1.1. */
@font-face{font-family:'Public Sans';font-style:normal;font-weight:400 700;font-display:swap;
  src:url(public-sans.woff2) format('woff2')}

/* One token set, defined once on :root and redefined only by value. Nothing below the
   palette blocks names a colour directly, so both themes stay in step. */
:root{
  --bg:#F5F6F9; --panel:#FFF; --sunk:#EFF1F5; --line:#E1E4EB; --line2:#C9D0DA;
  --fg:#12161C; --fg2:#57616F; --fg3:#697485;
  --acc:#2B55C8; --acc-fg:#FFF; --acc-soft:#E9EEFB;
  --warn:#8A4A0B; --warn-soft:#FBF1E3; --warn-line:#E3C599;
  --bad:#A8261E; --bad-soft:#FCEBE9; --bad-line:#EDB9B4;
  --good:#0F6B3F; --good-soft:#E4F3EB;
  --sh1:0 1px 2px rgba(18,22,28,.07);
  --sh2:0 10px 28px -12px rgba(18,22,28,.34), 0 2px 6px -2px rgba(18,22,28,.14);
  --r:9px; --rs:6px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0C0F13; --panel:#151A20; --sunk:#1C222A; --line:#262D36; --line2:#39424E;
  --fg:#E7ECF2; --fg2:#98A3B1; --fg3:#7F8A99;
  --acc:#88A6FF; --acc-fg:#0C0F13; --acc-soft:#1A2440;
  --warn:#E4B173; --warn-soft:#2A2115; --warn-line:#4A3A1E;
  --bad:#F09189; --bad-soft:#2B1817; --bad-line:#4D2723;
  --good:#62C490; --good-soft:#11281D;
  --sh1:0 1px 2px rgba(0,0,0,.55);
  --sh2:0 12px 30px -14px #000, 0 2px 8px -3px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme=dark]{
  --bg:#0C0F13; --panel:#151A20; --sunk:#1C222A; --line:#262D36; --line2:#39424E;
  --fg:#E7ECF2; --fg2:#98A3B1; --fg3:#7F8A99;
  --acc:#88A6FF; --acc-fg:#0C0F13; --acc-soft:#1A2440;
  --warn:#E4B173; --warn-soft:#2A2115; --warn-line:#4A3A1E;
  --bad:#F09189; --bad-soft:#2B1817; --bad-line:#4D2723;
  --good:#62C490; --good-soft:#11281D;
  --sh1:0 1px 2px rgba(0,0,0,.55);
  --sh2:0 12px 30px -14px #000, 0 2px 8px -3px rgba(0,0,0,.6);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font:400 14.5px/1.55 'Public Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  font-variant-numeric:tabular-nums}
::selection{background:var(--acc-soft);color:var(--fg)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:var(--rs)}
*{scrollbar-color:var(--line2) transparent;scrollbar-width:thin}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.012em;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
svg{display:block;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.lbl{font-size:11.5px;font-weight:650;letter-spacing:.055em;text-transform:uppercase;
  color:var(--fg2);line-height:1.4}
.group-h .lbl{font-size:12.5px;color:var(--fg)}
.help{font-size:12.5px;line-height:1.5;color:var(--fg2);max-width:72ch}
.sample{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;
  line-height:1.55;color:var(--fg2);background:var(--panel);border:1px solid var(--line);
  border-radius:6px;padding:8px 10px;margin:0;overflow-x:auto}
.help.warn{color:var(--warn)}
.help.bad{color:var(--bad)}

/* ── Toolbar ──────────────────────────────────────────────────────────── */
.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);
  padding:9px 18px;display:flex;align-items:center;gap:14px}
.top h1{font-size:16px;letter-spacing:-.02em;flex:none}
.top h1 .brand{all:unset;cursor:pointer;font:inherit;letter-spacing:inherit;color:inherit}
.top h1 .brand:hover{color:var(--acc)}
.top .meta{color:var(--fg3);font-size:12.5px;display:flex;gap:16px;min-width:0;flex:1 1 auto}
.top .meta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .meta span.ltr{flex:none}
.top .acts{display:flex;gap:10px;flex:none}
@media (max-width:700px){
  .top{flex-wrap:wrap}
  .top .meta{order:3;flex-basis:100%}
  .top .acts{margin-left:auto}
}

.btn{border:1px solid var(--line2);background:var(--panel);border-radius:var(--r);
  padding:7px 13px;font-size:13.5px;font-weight:550;box-shadow:var(--sh1);white-space:nowrap;
  transition:background .14s ease,border-color .14s ease,color .14s ease}
.btn:hover:not(:disabled){background:var(--sunk);border-color:var(--fg3)}
.btn:disabled{opacity:.5;cursor:default;box-shadow:none}
.btn.primary{background:var(--acc);color:var(--acc-fg);border-color:transparent}
.btn.primary:hover:not(:disabled){background:var(--acc);filter:brightness(1.1)}
.btn.primary.done{background:var(--good);filter:none}
.btn.icon{padding:0;width:34px;height:34px;display:grid;place-items:center}
.btn.danger{color:var(--bad)}
.btn.danger:hover:not(:disabled){background:var(--bad-soft);border-color:var(--bad-line)}

/* ── Shell ────────────────────────────────────────────────────────────── */
.shell{max-width:1280px;margin:0 auto;padding:16px 18px 80px;
  display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
.shell.settings-view{grid-template-columns:minmax(0,1fr)}
.shell.settings-view .list{display:none}
.msg{grid-column:1/-1;border-radius:var(--r);padding:10px 13px;font-size:13.5px;line-height:1.5;
  border:1px solid}
.msg.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-line)}
.msg.good{background:var(--good-soft);color:var(--good);border-color:var(--good)}

/* ── Rule list ────────────────────────────────────────────────────────── */
.list{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh1);overflow:hidden;position:sticky;top:72px}
.list-h{padding:12px 15px 13px;border-bottom:1px solid var(--line)}
.list-h h2{font-size:14.5px}
.list-h .help{margin-top:5px}
.rows{max-height:min(58vh,600px);overflow:auto}
.row{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:11px;align-items:start;
  width:100%;text-align:left;padding:11px 15px;border-bottom:1px solid var(--line);
  transition:background .12s ease}
.row:hover{background:var(--sunk)}
.row[aria-current=true]{background:var(--acc-soft)}
.row[aria-current=true] .r-name{color:var(--acc)}
.row .n{color:var(--fg3);font-size:12px;font-weight:650;line-height:1.65}
.r-name{font-weight:600;font-size:14px;display:block;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.r-name.anon{font-weight:500;color:var(--fg3)}
.r-sub{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  color:var(--fg2);font-size:12.5px;line-height:1.45;margin-top:2px}
.row.shadowed .r-sub{color:var(--warn)}
.row.shadowed .r-name{text-decoration:line-through;text-decoration-color:var(--fg3)}
.badge{border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:650;white-space:nowrap;
  background:var(--sunk);color:var(--fg2);line-height:1.5}
.badge.wild{background:var(--warn-soft);color:var(--warn)}
.badge.blind{background:var(--sunk);color:var(--fg2)}
.badge.dead{background:var(--bad-soft);color:var(--bad)}
.badge.wait{color:var(--fg2)}
.list-f{padding:11px 15px;display:grid;gap:8px}
.list-f[hidden]{display:none}
.list-f .btn{width:100%}
.row{cursor:grab}
.row .grip{color:var(--fg3);opacity:.4;align-self:center}
.row:hover .grip,.row[aria-current=true] .grip{opacity:1}
.row.drag{opacity:.4}
.btn.icon[aria-pressed=true]{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}

/* ── Detail pane ──────────────────────────────────────────────────────── */
.pane{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh1);overflow:hidden;min-width:0}
.hist{grid-column:2}
.hist[hidden]{display:none}
.pane-h{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;gap:10px;flex-wrap:wrap}
.pane-h .name{flex:1 1 160px;width:auto;font-size:17px;font-weight:600;letter-spacing:-.02em;
  background:none;border-color:transparent;padding:5px 8px}
.pane-h .name:hover{border-color:var(--line2)}
.pane-h .name:focus{background:var(--panel);border-color:var(--acc)}
.pane-h .name::placeholder{font-weight:500}
.pane-h h2{font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.pane-h h2.anon{color:var(--fg3);font-weight:500}
.pane-h .back{display:none}
/* Settings has no list beside it to click back into, at any width, so its own back
   button stands in for the list regardless of viewport. */
.pane-h .back.settings-back{display:grid}

.group{padding:16px 18px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.group:last-child{border-bottom:0}
.group.ans{background:var(--sunk);border-top:1px solid var(--line)}
.group-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.group-h .help{margin-top:3px}
.group-t{min-width:0}

.hits{border:1px solid var(--line);border-radius:var(--rs);overflow:auto;
  max-height:260px;background:var(--panel);overscroll-behavior-x:contain}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:var(--panel);text-align:left;padding:7px 12px;
  border-bottom:1px solid var(--line);font-size:11.5px;font-weight:650;letter-spacing:.055em;
  text-transform:uppercase;color:var(--fg2);z-index:1}
td{padding:7px 12px;border-bottom:1px solid var(--line);vertical-align:top;
  overflow-wrap:break-word}
tbody tr:last-child td{border-bottom:0}
td.reg{font-weight:600;white-space:nowrap}
td.tg{color:var(--fg3)}
td.num{white-space:nowrap;font-variant-numeric:tabular-nums}
.more{width:calc(100% - 20px);margin:10px}

/* ── Sent alerts ──────────────────────────────────────────────────────────
   Reuses the .hits scroll box: a taller one, because a notification is a paragraph and
   not a row. */
.hits.sent{max-height:340px;min-width:0}
.sent-i{padding:10px 12px;border-bottom:1px solid var(--line);display:grid;gap:5px}
.sent-i:last-of-type{border-bottom:0}
.sent-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sent-h .t{font-weight:600;font-size:13px;overflow-wrap:anywhere}
.sent-h .when{font-size:12px;color:var(--fg3);white-space:nowrap;
  font-variant-numeric:tabular-nums;flex:none}
.sent-m{font-size:12.5px;line-height:1.5;color:var(--fg2);white-space:pre-wrap;
  overflow-wrap:anywhere;margin:0}
.sent-f{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:11.5px;
  color:var(--fg3)}
.sent-f a{color:var(--fg3);text-decoration:underline;text-underline-offset:2px;
  text-decoration-thickness:from-font;overflow-wrap:anywhere}

/* ── Condition cards ──────────────────────────────────────────────────── */
.cond{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 11px;
  display:grid;gap:7px}
.cond.blind{background:var(--warn-soft);border-color:var(--warn-line)}
.cond.bad{border-color:var(--bad-line);background:var(--bad-soft)}
.cond-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.cond.blind .cond-h .lbl{color:var(--warn)}
.cond.bad .cond-h .lbl{color:var(--bad)}
.x{color:var(--fg3);width:24px;height:24px;border-radius:var(--rs);display:grid;
  place-items:center;flex:none}
.x:hover{color:var(--bad);background:var(--bad-soft)}
.vals{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);
  border:1px solid var(--line2);border-radius:99px;padding:3px 5px 3px 11px;font-size:13px;
  max-width:100%;line-height:1.5}
.chip>.v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .n{font-weight:600;font-size:11px;color:var(--fg3);font-variant-numeric:tabular-nums}
.chip.miss{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad)}
.chip.miss .n{color:var(--bad)}
.chip.feed{border-style:dashed}
.chip button{color:var(--fg3);display:grid;place-items:center;border-radius:99px;
  width:20px;height:20px;flex:none}
.chip button:hover{color:var(--bad);background:var(--bad-soft)}
.chip.toggle{cursor:pointer;transition:background .12s ease,border-color .12s ease}
.chip.toggle[aria-pressed=false],.chip.radio:not(:has(:checked)){background:none;border-style:dashed;color:var(--fg2)}
.chip.toggle[aria-pressed=true],.chip.radio:has(:checked){background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
/* A real radio, sized away rather than display:none so it stays focusable and keeps the
   arrow keys and the group semantics the browser gives for free. */
.chip.radio{cursor:pointer;padding:3px 11px;transition:background .12s ease,border-color .12s ease}
.chip.radio input{position:absolute;width:0;height:0;opacity:0}
.chip.radio:has(:focus-visible){outline:2px solid var(--acc);outline-offset:2px}
.chip.toggle{padding-right:11px}
.mini{border:1px dashed var(--line2);border-radius:99px;padding:3px 12px;font-size:12.5px;
  color:var(--fg2);font-weight:550;white-space:nowrap;
  transition:border-color .14s ease,color .14s ease}
.mini:hover:not(:disabled){border-color:var(--acc);color:var(--acc);border-style:solid}
.mini:disabled{opacity:.5;cursor:default}
.mini.plus{padding-left:9px;padding-right:9px;font-size:15px;line-height:1}
.linkish{color:inherit;text-decoration:underline;text-underline-offset:2px;
  text-decoration-thickness:from-font;font:inherit}
.linkish:hover{color:var(--fg)}
.numrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.numrow .unit{color:var(--fg2);flex:none}
input[type=text],input[type=number],input[type=password],select,textarea{border:1px solid var(--line2);background:var(--panel);
  border-radius:var(--rs);padding:7px 9px;width:100%;min-width:0}
input:disabled,select:disabled{background:var(--sunk);color:var(--fg3);cursor:not-allowed}
input::placeholder,textarea::placeholder{color:var(--fg3)}
textarea{resize:vertical;line-height:1.45}
.numrow input.num{width:10ch;text-align:right}

.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px 18px}
.field{display:grid;gap:5px;align-content:start;min-width:0}
.field.narrow{max-width:300px}

.empty{padding:48px 20px;text-align:center;display:grid;gap:8px;justify-items:center}
.empty .help{max-width:46ch}

/* ── Picker popover ───────────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;z-index:55}
.pop{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line2);
  border-radius:var(--r);box-shadow:var(--sh2);width:min(360px,calc(100vw - 24px));
  max-height:min(62vh,460px);display:flex;flex-direction:column;overflow:hidden}
.pop-h{padding:10px 12px;border-bottom:1px solid var(--line);display:grid;gap:7px}
.pop-l{overflow:auto;flex:1;overscroll-behavior:contain}
.pop-note{padding:8px 12px;font-size:12px;line-height:1.45;color:var(--fg2);
  background:var(--sunk);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1}
.pop-g{padding:9px 12px 4px;position:sticky;top:0;background:var(--panel);z-index:1;
  border-bottom:1px solid var(--line)}
.opt{display:flex;width:100%;align-items:baseline;gap:10px;padding:7px 12px;text-align:left;
  font-size:13.5px;line-height:1.45;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:0}
.opt:hover,.opt.active{background:var(--sunk)}
.opt .box{width:13px;height:13px;border:1.5px solid var(--line2);border-radius:3.5px;
  flex:none;translate:0 2px;display:grid;place-items:center;color:transparent}
.opt.on .box{background:var(--acc);border-color:var(--acc);color:var(--acc-fg)}
.opt .t{min-width:0;overflow-wrap:anywhere}
.opt .n{margin-left:auto;color:var(--fg3);font-size:12px;flex:none;
  font-variant-numeric:tabular-nums}
.pop-e{padding:14px 12px;color:var(--fg2);font-size:13px;line-height:1.5}

.lock .env{font-weight:600;color:var(--fg)}

@media (max-width:600px){
  .group-h{flex-direction:column;align-items:stretch}
  .group-h .mini{align-self:flex-start}
}
@media (pointer:coarse){
  .chip button{width:24px;height:24px}
  .opt{padding-top:10px;padding-bottom:10px}
}
@media (max-width:900px){
  .list-f[hidden]{display:grid}
  /* Anything under 16px is a field iOS zooms into on focus, and this page is read
     one-handed while something is overhead. */
  input[type=text],input[type=number],input[type=password],select,textarea{font-size:16px}
  .shell{grid-template-columns:1fr;padding:12px 12px 80px}
  .list{position:static}
  .rows{max-height:none}
  body[data-view=detail] .list{display:none}
  body[data-view=list] .pane{display:none}
  .hist{grid-column:1}
  .pane-h .back{display:grid}
  .top{padding:10px 12px}
}
</style>

<!--
THESIS: The rule set is the page, read as a sequence of plain sentences with a coverage
  figure on every one, because a rule that matches nothing is this product's characteristic
  failure. It refuses the settings-form arrangement where rules are a subsection and
  coverage is something you ask for.
OWN-WORLD: The operations-console canon, played straight. Cool-biased neutrals, one indigo
  accent, semantic amber and red kept separate from it, Public Sans embedded as a latin
  subset, 9px radii, one-pixel hairlines, shadows only on the two panels.
STORY: The operator reads down the list, sees what each rule catches and how much of the
  database it covers, opens the one selecting nothing, fixes it, saves.
FIRST VIEWPORT: Toolbar with the file path and database size; rule list on the left with
  coverage badges aligned in one column; the selected rule on the right, its figure first.
FORM: The category canon, taken as the standing exit from the direction roll (seed
  5f01975e) after three built prototypes.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
<div class="top">
  <h1><button type="button" class="brand" id="brand" aria-label="Back to the rule list">Sky Notify</button></h1>
  <div class="meta"></div>
  <div class="acts">
    <button class="btn icon" id="settings" aria-pressed="false" aria-label="Settings"></button>
    <button class="btn icon" id="theme" aria-label="Switch between light and dark"></button>
  </div>
</div>

<div class="shell">
  <div class="msg bad" id="msg" hidden role="alert"></div>

  <nav class="list" aria-label="Rules">
    <div class="list-h">
      <h2>Rules</h2>
      <p class="help">Checked in order. The first match wins.</p>
    </div>
    <div class="rows" id="rows"></div>
    <div class="list-f">
      <button class="btn" id="add">Add a rule</button>
    </div>
  </nav>

  <section class="pane" id="pane" aria-live="polite"></section>
  <section class="pane hist" id="hist" hidden></section>
</div>

<script>
/* ─────────────────────────────────────────────────────────────────────────
   sky-notify alert settings.

   The page edits the alerts document through three endpoints: GET /api/alerts for
   the document plus the database's vocabulary and the env-locked keys, POST
   /api/preview for what one rule selects, and PUT /api/alerts to write it back.

   A rule is an allowlist, so the failure worth designing against is the rule
   that matches nothing: it costs every alert it was meant to catch and the
   document looks perfect. Coverage is therefore on screen at all times, never on
   request.
   ───────────────────────────────────────────────────────────────────────── */

const $ = s => document.querySelector(s);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c;
  if (x != null) n.textContent = x; return n; };
const svg = (d, s = 16) =>
  `<svg viewBox="0 0 16 16" width="${s}" height="${s}" aria-hidden="true">${d}</svg>`;
const I = {
  plus: '<path d="M8 2.5v11M2.5 8h11"/>',
  x: '<path d="M3.8 3.8l8.4 8.4M12.2 3.8l-8.4 8.4"/>',
  up: '<path d="M3.5 9.5L8 5l4.5 4.5"/>',
  down: '<path d="M3.5 6.5L8 11l4.5-4.5"/>',
  left: '<path d="M9.5 3L5 8l4.5 5"/>',
  tick: '<path d="M3.5 8.4l3 3 6-6.8"/>',

const SOURCE = {db: 'Database', both: 'Database + live'};
const BY_KEY = Object.fromEntries(CONDITIONS.map(c => [c.key, c]));

/* ── State ────────────────────────────────────────────────────────────────

const originOf = u => { try { const p = new URL(u); return p.protocol + '//' + p.host; } catch { return ''; } };
const keyStrandedBy = url => aiKeySet && !keyEdited && !!originOf(url) && originOf(url) !== keyOrigin;
/* Research needs somewhere to ask, and that is now an ordinary hot-reloaded setting. */
const aiReady = () => !!(setting('ai.url', doc?.ai?.url) && setting('ai.model', doc?.ai?.model));
/* Save lives at the end of whatever the pane is showing, so it is re-appended by every

saveBtn.id = 'save';
saveBtn.type = 'button';
saveBtn.disabled = true;

let prevSel = 0;        // rule index to return to when settings is closed

/* Everything the page knows about a rule that is not part of the rule itself: its last
   preview, the cooldown key the server computed for it, and which conditions are open in
   the editor. Keyed by the rule object rather than by position, so reordering and
   deleting carry it along with no bookkeeping, and a stale record cannot outlive the
   rule it described.

   condition added but not yet given a value is open in the editor and absent from the
   saved rule; conflating the two made a freshly added condition vanish the instant it
   was added. */
const RULE = new WeakMap();
function meta(r) {
  let m = RULE.get(r);

}
const openKeys = r => CONDITIONS.filter(c => meta(r).shown.has(c.key)).map(c => c.key);

const stated = r => CONDITIONS.map(c => c.key).filter(k => hasValue(r[k]));

const at = (o, p) => p.split('.').reduce((v, k) => v?.[k], o);
const put = (o, p, v) => { const q = p.split('.'), k = q.pop();
  q.reduce((x, n) => x[n], o)[k] = v; };

/* ── Theme ────────────────────────────────────────────────────────────────
   Three states, not two: an explicit choice, or nothing at all and the system
   decides. Only a deliberate click is remembered.                           */
(function theme() {
  const KEY = 'sky-notify-theme';
  const btn = $('#theme');
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch {}
  const paint = t => {
    if (t) document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
    const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    btn.innerHTML = svg(dark ? I.sun : I.moon);
    btn.setAttribute('aria-label', dark ? 'Switch to light' : 'Switch to dark');
  };
  paint(saved);
  btn.onclick = () => {
    const now = document.documentElement.getAttribute('data-theme');
    const dark = now ? now === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    const next = dark ? 'light' : 'dark';
    try { localStorage.setItem(KEY, next); } catch {}
    paint(next);
  };
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (!document.documentElement.getAttribute('data-theme')) paint(null);

/* ── Saying what a rule does ──────────────────────────────────────────────
   A rule set is audited by reading down it, so each rule has to read back as a
   sentence. The document is the record; this is the thing you can scan.      */
function list(values, join = ' or ') {
  const v = values.map(String);
  if (v.length <= 2) return v.join(join);
  return v.slice(0, -1).join(', ') + join + v[v.length - 1];
}
const CLASS_WORDS = {civ: 'civilian', gov: 'government', mil: 'military', pol: 'police'};

function summarise(r) {
  const parts = [];
  const say = (k, fn) => { if (hasValue(r[k])) parts.push(fn(r[k])); };
  say('cmpg', v => list(v.map(x => CLASS_WORDS[String(x).toLowerCase()] || x)) + ' aircraft');
  say('category', v => 'in ' + list(v));
  say('tags', v => 'tagged ' + list(v));
  say('operator', v => 'flown by ' + list(v));
  say('type', v => list(v));
  say('icao_type', v => 'type code ' + list(v));
  say('reg', v => 'registered ' + list(v));
  say('icao', v => 'hex ' + list(v));
  say('squawk', v => 'squawking ' + list(v));
  /* "starting" carries the whole difference from every other clause here, which reads
     as exact. Saying just "callsign SWA" would describe a rule nothing satisfies. */
  say('callsign', v => 'callsign starting ' + list(v));
  if (r.listed === true) parts.push('listed in the database');
  if (r.listed === false) parts.push('not in the database');
  const lo = hasValue(r.min_altitude_ft), hi = hasValue(r.max_altitude_ft);
  if (lo && hi) parts.push(`between ${(+r.min_altitude_ft).toLocaleString()} and ${(+r.max_altitude_ft).toLocaleString()} ft`);
  else if (lo) parts.push(`above ${(+r.min_altitude_ft).toLocaleString()} ft`);
  else if (hi) parts.push(`below ${(+r.max_altitude_ft).toLocaleString()} ft`);
  say('max_distance_nm', v => `within ${v} NM of the receiver`);
  if (r.circling === true) parts.push('while circling');
  if (r.circling === false) parts.push('while not circling');
  say('passes_within_nm', v => `predicted to pass within ${v} NM in the next ` +
    (hasValue(r.passes_within) ? r.passes_within : '5m'));
  /* Appended, not woven in: the sentence is read to audit what a rule claims, and when
     it is announced is not a claim. */
  const when = r.notify === 'closest_pass' ? ', alerted at its closest pass' : '';
  if (!parts.length) return 'Every aircraft — no conditions set' + when + '.';
  return parts.join(', ').replace(/^./, c => c.toUpperCase()) + when + '.';
}

const ruleLabel = r => r.name || 'Unnamed rule';

/* ── What the preview can honestly say ────────────────────────────────────
   The preview searches the database, so a count is only a count when a database
   row could both narrow the rule and satisfy it. Left alone, a squawk-only rule
   would read as the whole database and a `listed: false` rule as zero — two lies
   dressed up as figures.                                                      */
function coverage(r) {
  const keys = stated(r);
  const p = meta(r).preview;
  if (!keys.length) return {kind: 'wild', figure: 'Every',
    note: 'No conditions, so this matches every aircraft and no rule below it is ever reached.'};
  if (r.listed === false) {
    /* Nothing broadcasts an operator or a tag: those come off the database row, and
       this rule has just asked for aircraft that have no row. It can never match. */
    const owned = DB_ONLY.filter(k => hasValue(r[k]));
    if (owned.length) return {kind: 'dead', figure: '—',
      note: 'This rule wants aircraft that are not in the database, but '
        + list(owned.map(k => BY_KEY[k].short || BY_KEY[k].label.toLowerCase()), ' and ')
        + ' is only known for aircraft that are. It will never alert.'};
    return {kind: 'blind', figure: '—',
      note: 'This rule matches only aircraft that are not in the database, so there is nothing to count.'};
  }
  if (!keys.some(k => BY_KEY[k].source !== 'feed')) return {kind: 'blind', figure: '—',
    note: 'Nothing here can be counted in advance. See Overhead right now, below.'};
  if (!p) return {kind: 'wait', figure: '…', note: 'Checking…'};
  if (p.error) return {kind: 'error', figure: '—', note: 'Could not check this rule: ' + p.error};

  const feedToo = canMatchFeed(r);
  if (p.total === 0) return feedToo
    ? {kind: 'zero', figure: '0', note: 'No aircraft in the database match, but one broadcasting a match still alerts.'}
    : {kind: 'dead', figure: '0', note: 'Nothing can match this rule. It will never alert.'};
  return {kind: 'count', figure: p.total.toLocaleString(),
    note: `of the ${(p.database ?? 0).toLocaleString()} aircraft in the database match who this rule is looking for.`};
}

/* A zero is inconclusive two different ways. reg and icao_type are matched against either
   source, so a rule narrowed by one can still catch an aircraft whose database row says
   otherwise. And unless a rule states something only a database row carries, it can match
   an aircraft with no row at all.

   The hex is not one of those: it is the key the database row is looked up by, so a hex
   the database has never heard of cannot arrive from the feed carrying another aircraft's
   row. A rule that pairs one with `listed: true`, or with anything only a row can answer,
   is dead rather than merely unpreviewable. */
const DB_ONLY = ['cmpg', 'category', 'tags', 'operator', 'type'];
const EITHER_SOURCE = ['reg', 'icao_type'];
function canMatchFeed(r) {
  if (EITHER_SOURCE.some(k => hasValue(r[k]))) return true;
  return r.listed !== true && !DB_ONLY.some(k => hasValue(r[k]));
}

/* Conditions the database cannot answer at all, named next to the figure so a rule that
   looks unnarrowed can be seen to be simply unpreviewable. */
const blindKeys = r => stated(r).filter(k => BY_KEY[k].source === 'feed');

/* ── Save-time problems, said before the save ─────────────────────────────
   The server validates the whole document and rejects all of it, so a rule that
   would be refused says so where it is built rather than at the bottom of the
   page after a failed write. */
function problem(r, key) {
  const spec = BY_KEY[key];
  /* The number fields are text inputs so they can keep a caret, which means they will
     also accept letters. The server would answer a decode error naming no field; this
     says which one, before the save and before the preview asks. */
  if (spec.kind === 'num' && hasValue(r[key]) && !Number.isFinite(Number(r[key])))
    return spec.integer ? 'Must be a whole number.' : 'Must be a number.';
  if (DB_ONLY.includes(key) && hasValue(r[key]) && r.listed === false)
    return 'Only aircraft in the database have this, and this rule wants ones that are not. Remove this or the “in the database” condition.';
  if (spec.needsPosition && hasValue(r[key]) && (setting('lat', doc.lat) == null || setting('lon', doc.lon) == null))
    return 'Set the receiver position in Settings first.';
  if (spec.needsFastPoll && r.circling === true) {
    const iv = setting('source.poll_interval', doc.source.poll_interval);
    const s = parseDuration(iv);
    if (s != null && s > 30)
      return `Needs a check interval of 30s or less; it is ${iv}.`;
  }
  if (key === 'max_altitude_ft' && hasValue(r.min_altitude_ft) && hasValue(r.max_altitude_ft)
      && +r.max_altitude_ft <= +r.min_altitude_ft)
    return 'Must be above the lowest altitude.';
  if (key === 'passes_within' && hasValue(r.passes_within)) {
    /* Signed durations parse, so a negative one is a number rather than a refusal, and
       the server rejects it on a rule that would otherwise have looked fine here. */
    const ahead = parseDuration(r.passes_within);
    if (ahead === null) return 'Must be a duration like 5m or 30s.';
    if (ahead <= 0) return 'Must be longer than zero.';
  }
  return null;
}
/* The environment overrides the file, and the server validates the overlay, so a check
   made against the file alone would call a rule invalid over a setting the file does not
   own. Anything locked reads from the environment; everything else reads live from the
   document being edited. */
function setting(key, fileValue) {
  return locks[key] ? locks[key].value : fileValue;
}

/* Go's duration syntax, which is what the server parses these with, down to the corners:
   an optional sign, then one or more number-unit pairs where the number may lead or
   trail its point. So 1m30s, .5m, 1.m and +1m all parse, and only a bare 0 goes
   without a unit. Verified case by case against time.ParseDuration. */
const DUR_UNIT = {ns: 1e-9, us: 1e-6, 'µs': 1e-6, ms: .001, s: 1, m: 60, h: 3600};
function parseDuration(v) {
  let t = String(v ?? '').trim();
  const sign = t[0] === '-' ? -1 : 1;
  if (t[0] === '+' || t[0] === '-') t = t.slice(1);
  if (t === '0') return 0;
  const re = /(\d+\.?\d*|\.\d+)(ns|us|µs|ms|s|m|h)/y;
  /* A sticky regex resets lastIndex when it finally fails, so the end of the last
     match is kept: the whole string must be pairs, or this is not a duration. */
  let total = 0, end = 0, m;
  while ((m = re.exec(t))) { total += +m[1] * DUR_UNIT[m[2]]; end = re.lastIndex; }
  return t && end === t.length ? sign * total : null;
}

/* ── Messages ─────────────────────────────────────────────────────────── */
let msgTimer = null;
function message(text, kind) {
  const m = $('#msg');
  clearTimeout(msgTimer);
  if (!text) { m.hidden = true; return; }
  m.textContent = text;
  m.className = 'msg ' + kind;
  m.hidden = false;
  if (kind === 'good') msgTimer = setTimeout(() => { m.hidden = true; }, 4000);
}

function markDirty() {
  dirty = true;
