/* ── Popover ──────────────────────────────────────────────────────────────
   One at a time, closed by Escape, a click outside, or committing a value.   */
let closePop = null;
function popover(anchor, build) {
  closePop?.();
  const scrim = el('div', 'scrim'), pop = el('div', 'pop');
  const done = () => { pop.remove(); scrim.remove(); closePop = null;
    document.removeEventListener('keydown', onKey); anchor.focus(); };
  const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); done(); } };
  scrim.onclick = done;
  document.addEventListener('keydown', onKey);
  closePop = done;
  build(pop, done);
  document.body.append(scrim, pop);
  place(pop, anchor);
  pop.querySelector('input')?.focus();
}
function place(pop, anchor) {
  const r = anchor.getBoundingClientRect();
  const w = pop.offsetWidth, h = pop.offsetHeight;
  pop.style.left = Math.max(12, Math.min(r.left, innerWidth - w - 12)) + 'px';
  pop.style.top = (r.bottom + h + 12 <= innerHeight ? r.bottom + 6
    : Math.max(12, r.top - h - 6)) + 'px';
}

/* ── The value picker ─────────────────────────────────────────────────────
   A native <datalist> cannot cope with this: at a couple of thousand tags the
   browser silently truncates its popup, so you cannot tell whether what you
   want is missing or merely out of view. This filters, ranks prefix matches
   first, counts what it left out, and renders in batches as you scroll.

   The pool is the rule's own facets — the values still reachable given its
   other conditions — falling back to the whole vocabulary before the first
   preview has returned.                                                      */
function valuePicker(anchor, r, key, after) {
  const spec = BY_KEY[key];
  popover(anchor, pop => {
    const head = el('div', 'pop-h');
    head.append(el('div', 'lbl', spec.label));
    const q = el('input'); q.type = 'text'; q.autocomplete = 'off';
    q.placeholder = spec.open ? 'Search, or type any code and press Enter' : 'Search…';
    q.setAttribute('aria-label', 'Search ' + spec.label.toLowerCase());
    head.append(q);
    pop.append(head);
    const listEl = el('div', 'pop-l');
    pop.append(listEl);

    /* aircraft.json carries a type code for every aircraft overhead, listed or not, so
       the type picker is not the database's to bound: whatever the receiver has heard is
       offered beside it, marked, and the database's own count is kept where both know a
       code. Every other field is a database column and has nothing to fold in. */
    const extra = key === 'icao_type' ? feedTypes : [];
    const known = new Set((vocab[key] || []).map(v => v.value.toLowerCase()));
    const dbPool = () => meta(r).preview?.facets?.[key] || vocab[key] || [];
    /* A code the pool above does not reach is out for one of two reasons, and they are
       not the same thing to say: the database has never heard of it, or it has but no
       aircraft matching this rule's other conditions carries it. inDb keeps them apart. */
    const pool = () => {
      const db = dbPool();
      if (!extra.length) return db;
      const have = new Set(db.map(v => v.value.toLowerCase()));
      return db.concat(extra.filter(v => !have.has(v.value.toLowerCase()))
                            .map(v => ({...v, feed: true, inDb: known.has(v.value.toLowerCase())})));
    };
    const narrowed = () => dbPool().length < (vocab[key] || []).length;
    let shown = [], rendered = 0, active = -1, body = null;

    const candidates = () => {
      const term = q.value.trim().toLowerCase();
      const chosen = new Set((r[key] || []).map(v => String(v).toLowerCase()));
      const starts = [], contains = [];
      for (const item of pool()) {
        const lv = item.value.toLowerCase();
        if (chosen.has(lv)) continue;
        if (!term) { starts.push(item); continue; }
        const at = lv.indexOf(term);
        if (at === 0) starts.push(item); else if (at > 0) contains.push(item);
      }
      return starts.concat(contains);
    };

    const grow = upTo => {
      const want = Math.min(shown.length, Math.max(rendered + ROW_CHUNK, (upTo ?? -1) + 1));
      if (want <= rendered || !body) return;
      const batch = document.createDocumentFragment();
      for (let n = rendered; n < want; n++) {
        const item = shown[n];
        const b = el('button', 'opt'); b.type = 'button'; b.dataset.i = n;
        const box = el('span', 'box'); box.innerHTML = svg(I.tick, 10);
        b.append(box, el('span', 't', item.value),
          el('span', 'n', item.feed ? item.count.toLocaleString() + ' on your feed'
                                    : item.count.toLocaleString()));
        if (item.feed) b.title = item.inDb
          ? 'Heard by your receiver. No aircraft in the database matches this rule and carries it.'
          : 'Heard by your receiver, but not in the database.';
        batch.append(b);
      }
      body.append(batch);
      rendered = want;
    };

    const paint = () => {
      for (const b of body.querySelectorAll('.opt.active')) b.classList.remove('active');
      const node = active >= 0 ? body.children[active] : null;
      if (node) { node.classList.add('active'); node.scrollIntoView({block: 'nearest'}); }
    };

    const draw = () => {
      shown = candidates(); rendered = 0; active = -1;
      body = el('div');
      /* Two handlers on the container rather than two per row: at a couple of
         thousand rows the per-row closures cost more than the rows. mousedown,
         not click — blur would close the popover before a click landed. */
      body.onmousedown = e => {
        const b = e.target.closest('.opt'); if (!b) return;
        e.preventDefault(); commit(shown[+b.dataset.i].value);
      };
      body.onmouseover = e => {
        const b = e.target.closest('.opt'); if (!b) return;
        active = +b.dataset.i; paint();
      };
      grow();
      const scope = narrowed() ? ' left for this rule' : '';
      const note = el('div', 'pop-note');
      if (!shown.length) note.textContent = q.value.trim()
        ? (spec.open
          ? 'No match here. Press Enter to use it anyway.'
          : 'No value matching that' + (scope || ' in the database') + '.')
        : 'Everything here is already selected.';
      else note.textContent = `${shown.length.toLocaleString()} ` +
        `${shown.length === 1 ? 'value' : 'values'}${scope}, with how many aircraft each covers.`;
      listEl.replaceChildren(note, body);
      listEl.scrollTop = 0;
    };

    const commit = value => {
      const v = String(value).trim();
      if (v && !(r[key] || []).some(x => String(x) === v)) r[key] = [...(r[key] || []), v];
      q.value = '';
      after();
      draw();
    };

    listEl.onscroll = () => {
      if (listEl.scrollTop + listEl.clientHeight > listEl.scrollHeight - 320) grow();
    };
    q.oninput = draw;
    q.onkeydown = e => {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        active = Math.min(shown.length - 1, Math.max(0, active + (e.key === 'ArrowDown' ? 1 : -1)));
        if (active >= rendered) grow(active);
        paint();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        /* Only commit something the database has, so a half-typed search cannot
           become a value that matches nothing. An open field is the exception:
           there the live feed is the other half of the world. */
        if (active >= 0) commit(shown[active].value);
        else if (spec.open) commit(q.value);
        else {
          const hit = pool().find(v => v.value.toLowerCase() === q.value.trim().toLowerCase());
          if (hit) commit(hit.value);
        }
      }
    };
    draw();
  });
}

/* A field with no database vocabulary to suggest from: anything typed is valid,
   because the live feed is the only thing that can answer it. */
function freePicker(anchor, r, key, after) {
  const spec = BY_KEY[key];
  popover(anchor, pop => {
    const head = el('div', 'pop-h');
    head.append(el('div', 'lbl', spec.label));
    const q = el('input'); q.type = 'text'; q.autocomplete = 'off';
    q.placeholder = 'Type a value and press Enter';
    q.setAttribute('aria-label', spec.label);
    head.append(q);
    pop.append(head);
    const listEl = el('div', 'pop-l');
    pop.append(listEl);
    const draw = () => {
      listEl.replaceChildren();
      if (!spec.quick) { listEl.append(el('div', 'pop-e', spec.help || '')); return; }
      const chosen = new Set((r[key] || []).map(v => String(v).toLowerCase()));
      for (const [v, text] of spec.quick) {
        const on = chosen.has(v.toLowerCase());
        const b = el('button', 'opt' + (on ? ' on' : '')); b.type = 'button';
        const box = el('span', 'box'); box.innerHTML = svg(I.tick, 10);
        b.append(box, el('span', 't', text));
        b.onclick = () => {
          r[key] = on ? (r[key] || []).filter(x => String(x).toLowerCase() !== v.toLowerCase())
                      : [...(r[key] || []), v];
          after(); draw();
        };
        listEl.append(b);
      }
    };
    q.onkeydown = e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const v = q.value.trim();
      if (!v || (r[key] || []).some(x => String(x) === v)) { q.value = ''; return; }
      r[key] = [...(r[key] || []), v];
      q.value = ''; after(); draw();
    };
    draw();
  });
}

/* The condition menu only offers what this rule is not already using, grouped by
   the question each condition asks. */
function conditionPicker(anchor, r, groupId, after) {
  popover(anchor, (pop, done) => {
    const head = el('div', 'pop-h');
    head.append(el('div', 'lbl', 'Add a condition'));
    pop.append(head);
    const listEl = el('div', 'pop-l');
    pop.append(listEl);
    const open = meta(r).shown;
    const items = CONDITIONS.filter(c => c.group === groupId && !open.has(c.key)
      && (!c.requires || open.has(c.requires)));
    for (const c of items) {
      const b = el('button', 'opt'); b.type = 'button';
      b.append(el('span', 't', c.label));
      if (SOURCE[c.source]) b.append(el('span', 'n', SOURCE[c.source]));
      b.onclick = () => {
        /* An added condition starts empty and states nothing until it is given a
           value: a blank one contributes nothing to the saved rule. `tri` is the
           exception — it has no empty state that means anything, so it starts at
           the choice most people want. */
        r[c.key] = c.kind === 'tri' ? true : c.kind === 'num' || c.kind === 'text' ? '' : [];
        open.add(c.key);
        done(); after(c.key);
      };
      listEl.append(b);
    }
    if (!items.length) listEl.append(el('div', 'pop-e',
      'All of these are already in use.'));
  });
}

/* ── One condition ────────────────────────────────────────────────────── */
function conditionCard(r, key) {
  const spec = BY_KEY[key];
  const bad = problem(r, key);
  const card = el('div', 'cond' + (bad ? ' bad' : spec.source === 'feed' ? ' blind' : ''));

  const head = el('div', 'cond-h');
  head.append(el('span', 'lbl', spec.label));
  const drop = el('button', 'x'); drop.type = 'button';
  drop.innerHTML = svg(I.x, 13);
  drop.setAttribute('aria-label', 'Remove the ' + spec.label.toLowerCase() + ' condition');
  drop.onclick = () => {
    delete r[key];
    meta(r).shown.delete(key);
    /* passes_within is meaningless without the distance it qualifies, and the
       server rejects the pair, so it leaves with it. */
    if (key === 'passes_within_nm') { delete r.passes_within; meta(r).shown.delete('passes_within'); }
    markDirty(); schedulePreview(r); renderPane(); renderList();
  };
  head.append(drop);
  card.append(head);

  if (spec.kind === 'num' || spec.kind === 'text') {
    const row = el('div', 'numrow');
    const input = el('input');
    input.id = 'c-' + key;
    /* Text, not number, even for the numbers: only a text input will report or accept a
       caret position, and a preview answer landing mid-edit has to be able to put the
       caret back where it was. inputmode still asks a phone for the numeric keypad, and
       the spinner arrows are no loss on a field like "within 15 NM". */
    input.type = 'text';
    if (spec.kind === 'num') {
      input.className = 'num';
      input.inputMode = spec.integer ? 'numeric' : 'decimal';
    }
    if (spec.placeholder) input.placeholder = spec.placeholder;
    input.value = r[key] ?? '';
    input.setAttribute('aria-label', spec.label);
    /* Typing must not rebuild the pane — the caret would jump. Only the figure,
       the sentence and the list row move until the next structural change. */
    input.oninput = () => {
      const n = Number(input.value);
      r[key] = input.value === '' ? ''
        : spec.kind !== 'num' ? input.value
        /* A number field now accepts any keystroke, so what is not a number is held as
           typed rather than written to the rule as NaN. The server would reject it, and
           so does the figure above, which stops counting the moment it stops parsing. */
        : !Number.isFinite(n) ? input.value
        : spec.integer ? Math.round(n) : n;
      markDirty(); schedulePreview(r); renderList();
    };
    row.append(input);
    if (spec.unit) row.append(el('span', 'unit lbl', spec.unit));
    card.append(row);
  } else if (spec.kind === 'tri') {
    const s = el('select');
    s.id = 'c-' + key;
    for (const [v, t] of spec.options) s.append(new Option(t, v));
    s.value = r[key] === undefined || r[key] === null ? '' : String(r[key]);
    s.setAttribute('aria-label', spec.label);
    s.onchange = () => {
      if (s.value === '') delete r[key]; else r[key] = s.value === 'true';
      markDirty(); schedulePreview(r); renderPane(); renderList();
    };
    card.append(s);
  } else if (spec.kind === 'fixed') {
    const vals = el('div', 'vals');
    for (const [v, t] of spec.options) {
      const on = (r[key] || []).some(x => String(x).toLowerCase() === v.toLowerCase());
      const b = el('button', 'chip toggle'); b.type = 'button';
      b.setAttribute('aria-pressed', String(on));
      b.append(el('span', 'v', t));
      b.onclick = () => {
        r[key] = on ? (r[key] || []).filter(x => String(x).toLowerCase() !== v.toLowerCase())
                    : [...(r[key] || []), v];
        markDirty(); schedulePreview(r); renderPane(); renderList();
      };
      vals.append(b);
    }
    card.append(vals);
  } else {
    card.append(valueChips(r, key));
  }

  if (bad) card.append(el('p', 'help bad', bad));
  /* The figure's own band already names every condition it cannot count, so a feed
     condition says nothing here. `both` is the one that adds something. */
  else if (spec.source === 'both') card.append(el('p', 'help',
    'A value no aircraft in the database carries still alerts when one broadcasts it.'));
  if (spec.help && !bad) card.append(el('p', 'help', spec.help));
  return card;
}

/* The chips for a list-valued condition, plus the button that adds another.
   Two different ways a value can cost you every alert it was meant to catch:
   one the database has never heard of, and a real one that no aircraft matching
   this rule's OTHER conditions carries. Both look fine in the document. */
function valueChips(r, key) {
  const spec = BY_KEY[key];
  const vals = el('div', 'vals');
  const known = new Set((vocab[key] || []).map(v => v.value.toLowerCase()));
  const heard = new Map(key === 'icao_type'
    ? feedTypes.map(v => [v.value.toLowerCase(), v.count]) : []);
  const facets = meta(r).preview?.facets?.[key];
  const reach = facets && new Map(facets.map(v => [v.value.toLowerCase(), v.count]));

  for (const raw of r[key] || []) {
    const v = String(raw), low = v.toLowerCase();
    const chip = el('span', 'chip');
    chip.append(el('span', 'v', v));
    if (spec.kind === 'pick') {
      const count = reach?.get(low);
      if (count !== undefined) {
        chip.append(el('span', 'n', count.toLocaleString()));
      } else if (!known.has(low)) {
        /* On a closed field the database is the whole world, so a value it has never
           heard of can only be a typo. On an open field the live feed is the other
           half of that world, and flagging it red would be a lie. */
        chip.classList.add(spec.open ? 'feed' : 'miss');
        chip.append(el('span', 'n', !spec.open ? 'not found'
          : heard.has(low) ? heard.get(low).toLocaleString() + ' on your feed' : 'feed only'));
        chip.title = spec.open
          ? 'Not in the database, but still alerts on any aircraft broadcasting it.'
          : 'Not in the database — this value will never match.';
      } else if (reach) {
        chip.classList.add(spec.open ? 'feed' : 'miss');
        chip.append(el('span', 'n', 'clashes'));
        chip.title = spec.open
          ? 'Nothing in the database has this and matches the rule’s other conditions. Only a broadcast can.'
          : 'No aircraft has this and matches the rule’s other conditions, so the rule matches nothing.';
      }
    }
    const drop = el('button'); drop.type = 'button';
    drop.innerHTML = svg(I.x, 10);
    drop.setAttribute('aria-label', 'Remove ' + v);
    drop.onclick = () => {
      r[key] = (r[key] || []).filter(x => String(x) !== v);
      markDirty(); schedulePreview(r); renderPane(); renderList();
    };
    chip.append(drop);
    vals.append(chip);
  }

  const many = (r[key] || []).length;
  const add = el('button', 'mini' + (many ? ' plus' : ''), many ? '+' : 'Choose a value');
  add.type = 'button';
  if (many) add.setAttribute('aria-label', 'Add another value');
  const after = () => { markDirty(); schedulePreview(r); renderPane(); renderList(); };
  add.onclick = () => (spec.kind === 'free' ? freePicker(add, r, key, after)
                                            : valuePicker(add, r, key, after));
  vals.append(add);
  return vals;
}

/* ── The rule list ────────────────────────────────────────────────────── */
/* Dragging reorders the rules in place. The up/down buttons on the pane stay: a keyboard
   reader cannot drag, and the same move has to be reachable without a pointer. */
let dragEl = null;
function dragHandlers(box) {
  box.ondragstart = e => {
    const row = e.target.closest('.row');
    if (!row) return;
    dragEl = row;
    row.classList.add('drag');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', row.dataset.i);   // Firefox drags nothing without it
  };
  /* The row is moved in the DOM as it is dragged rather than re-rendered: a rebuild would
     destroy the element being dragged and the browser would abort the drag with it. The
     array is only touched once, on drop, from where the row actually came to rest. */
  box.ondragover = e => {
    if (!dragEl) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const row = e.target.closest('.row');
    if (!row || row === dragEl) return;
    const box2 = row.getBoundingClientRect();
    box.insertBefore(dragEl, e.clientY > box2.top + box2.height / 2 ? row.nextSibling : row);
  };
  box.ondrop = e => { e.preventDefault(); dropped(box); };
  /* Only a drop commits. A drag called off — Escape, or released outside the list — still
     ends here, with the row sitting where it was dragged to and the array never touched;
     rebuilding from the array is what puts it back. A drop has already cleared dragEl. */
  box.ondragend = () => {
    if (!dragEl) return;
    dragEl.classList.remove('drag');
    dragEl = null;
    renderList();
  };
}
function dropped(box) {
  if (!dragEl) return;
  const from = +dragEl.dataset.i, to = [...box.children].indexOf(dragEl);
  dragEl.classList.remove('drag');
  dragEl = null;
  if (to < 0 || to === from) return renderList();
  const [moved] = doc.rules.splice(from, 1);
  doc.rules.splice(to, 0, moved);
  if (sel === from) sel = to;
  else if (typeof sel === 'number') {
    if (from < sel && to >= sel) sel--;
    else if (from > sel && to <= sel) sel++;
  }
  markDirty(); renderList(); renderPane();
}

function renderList() {
  /* A preview answer landing mid-drag would replace the row under the cursor. */
  if (dragEl) return;
  const box = $('#rows');
  dragHandlers(box);
  const hadFocus = document.activeElement?.closest?.('.row');
  const focusIndex = hadFocus ? [...box.children].indexOf(hadFocus) : -1;
  box.replaceChildren();

  let shadowed = false;
  doc.rules.forEach((r, i) => {
    const cov = coverage(r);
    const b = el('button', 'row' + (shadowed ? ' shadowed' : ''));
    b.type = 'button';
    b.draggable = true;
    b.dataset.i = i;
    b.setAttribute('aria-current', String(sel === i));
    b.onclick = () => select(i);
    b.append(el('span', 'n', String(i + 1)));

    const mid = el('span');
    const name = el('span', 'r-name' + (r.name ? '' : ' anon'), ruleLabel(r));
    mid.append(name);
    mid.append(el('span', 'r-sub', shadowed
      ? 'Never reached — a rule above matches every aircraft.'
      : summarise(r)));
    b.append(mid);

    /* The whole row is the drag handle — this only says so. */
    const grip = el('span', 'grip');
    grip.innerHTML = svg(I.grip, 14);
    b.append(grip);

    box.append(b);
    if (cov.kind === 'wild') shadowed = true;
  });

  if (!doc.rules.length) {
    const p = el('div', 'pop-e');
    p.textContent = 'No rules yet.';
    box.append(p);
  }
  $('.list-f').hidden = !doc.rules.length && !isSettings();

  $('#settings').setAttribute('aria-pressed', String(isSettings()));
  $('.shell').classList.toggle('settings-view', isSettings());

  if (focusIndex >= 0 && box.children[focusIndex]) box.children[focusIndex].focus();
}

function select(next) {
  if (next === 'settings' && sel !== 'settings') prevSel = sel;
  sel = next;
  document.body.dataset.view = 'detail';
  const path = isSettings() ? '/settings' : '/';
  if (location.pathname !== path) history.pushState(null, '', path);
  renderList();
  renderPane();
  if (innerWidth <= 900) scrollTo({top: 0, behavior: 'smooth'});
}
/* Settings has nothing next to it to click back into, so leaving it returns to
   whichever rule was open before — or the first one, if none was. */
function closeSettings() { select(typeof prevSel === 'number' ? prevSel : 0); }

/* ── The detail pane ──────────────────────────────────────────────────────
   A preview answer can arrive while the pane is being used, and a rebuild is the only
   render this page has. So the two things a rebuild costs are put back: the caret, or a
   slow answer takes the field out from under a half-typed number, and the scroll
   position, or reaching further down a list of matches throws you to the top.        */
function renderPane() {
  const pane = $('#pane'), shell = $('.shell');
  const had = document.activeElement;
  const id = shell.contains(had) && had.id ? had.id : null;
  const text = id && (had.type === 'text' || had.tagName === 'TEXTAREA'); // a select reports no caret
  const caret = text ? [had.selectionStart, had.selectionEnd] : null;
  const raw = text ? had.value : null;
  const y = scrollY;
  /* The table of matches scrolls inside its own box — vertically through the rows, and
     horizontally at phone width. Neither is the window's scroll, and both are where the
     operator was looking, and there are two of them. */
  const boxes = [...shell.querySelectorAll('.hits')].map(b => [b.scrollTop, b.scrollLeft]);
  paintPane(pane);
  const back = id && document.getElementById(id);
  if (back) {
    /* "1." and "1" are the same number but not the same half-typed value, and the rebuild
       reads the number. Only ever put back a string that means what is already there:
       anything else and the pane is showing a different rule, where it does not belong. */
    if (raw !== null && back.value !== raw && Number(back.value) === Number(raw)) back.value = raw;
    /* preventScroll: bringing the element into view is the browser scrolling every box
       between it and the window, which is every position this function is restoring. */
    back.focus({preventScroll: true});
    if (caret) back.setSelectionRange(caret[0], caret[1]);
  }
  /* After the focus, so that the focus cannot have moved either of them. */
  shell.querySelectorAll('.hits').forEach((b, i) => {
    if (boxes[i]) [b.scrollTop, b.scrollLeft] = boxes[i];
  });
  if (scrollY !== y) scrollTo(0, y);
}

function paintPane(pane) {
  pane.replaceChildren();
  $('#hist').hidden = true;
  if (isSettings()) return renderSettings(pane);

  if (!doc.rules.length) {
    const e = el('div', 'empty');
    e.append(el('h2', '', 'No rules'));
    e.append(el('p', 'help', 'Nothing alerts until a rule matches it. Add one to start.'));
    const b = el('button', 'btn primary', 'Add a rule'); b.type = 'button';
    b.onclick = addRule;
    e.append(b, saveBtn);
    pane.append(e);
    return;
  }

  if (sel > doc.rules.length - 1) sel = doc.rules.length - 1;
  const r = rule(), i = sel;
  const cov = coverage(r);
  const shadowed = doc.rules.slice(0, i).some(x => stated(x).length === 0);

  /* header */
  const head = el('div', 'pane-h');
  const back = el('button', 'btn icon back');
  back.innerHTML = svg(I.left, 15);
  back.setAttribute('aria-label', 'Back to the rule list');
  back.onclick = () => { document.body.dataset.view = 'list'; };
  head.append(back);
  /* The title is the name field. Nothing else edits it, so the header cannot fall out
     of step with it, and the id is what carries the caret through a repaint. */
  const name = el('input', 'name');
  name.type = 'text';
  name.id = 'rule-name';
  name.value = r.name || '';
  name.placeholder = 'Unnamed rule';
  name.setAttribute('aria-label', 'Rule name');
  name.oninput = () => { r.name = name.value; markDirty(); renderList(); };
  head.append(name);
  const move = (icon, delta, label) => {
    const b = el('button', 'btn icon');
    b.innerHTML = svg(icon, 15);
    b.setAttribute('aria-label', label);
    b.disabled = i + delta < 0 || i + delta >= doc.rules.length;
    b.onclick = () => {
      const [moved] = doc.rules.splice(i, 1);
      doc.rules.splice(i + delta, 0, moved);
      sel = i + delta;
      markDirty(); renderList(); renderPane();
    };
    return b;
  };
  const del = el('button', 'btn danger', 'Delete');
  del.type = 'button';
  del.setAttribute('aria-label', 'Delete this rule');
  del.onclick = () => {
    doc.rules.splice(i, 1);
    if (sel > doc.rules.length - 1) sel = Math.max(0, doc.rules.length - 1);
    markDirty(); renderList(); renderPane();
  };
  head.append(move(I.up, -1, 'Move this rule earlier'), move(I.down, 1, 'Move this rule later'),
              del, saveBtn);
  pane.append(head);

  if (shadowed) {
    const w = el('div', 'group');
    w.append(el('p', 'help warn', 'Never reached. A rule above it matches every aircraft.'));
    pane.append(w);
  }

  if (cov.kind === 'dead' || cov.kind === 'error') {
    const w = el('div', 'group');
    w.append(el('p', 'help bad', cov.note));
    pane.append(w);
  }

  pane.append(notificationBand(r));

  /* conditions, grouped by the question they ask */
  for (const g of GROUPS) {
    const keys = openKeys(r).filter(k => BY_KEY[k].group === g.id);
    const sec = el('div', 'group');
    const gh = el('div', 'group-h');
    const t = el('div', 'group-t');
    t.append(el('h3', 'lbl', g.label));
    if (g.help) t.append(el('p', 'help', g.help));
    gh.append(t);
    const add = el('button', 'mini', 'Add condition'); add.type = 'button';
    add.onclick = () => conditionPicker(add, r, g.id, () => {
      markDirty(); schedulePreview(r); renderPane(); renderList();
    });
    gh.append(add);
    sec.append(gh);
    for (const k of keys) sec.append(conditionCard(r, k));
    /* Only said where it is true: a rule with a distance and a circling condition states
       no identity, and is not the wildcard. */
    if (!keys.length) sec.append(el('p', 'help',
      g.id === 'identity' && !stated(r).length
        ? 'None. This rule matches every aircraft.'
        : 'None.'));
    pane.append(sec);
  }

  const hits = hitsBand(r, cov);
  if (hits) pane.append(hits);

  const hist = $('#hist');
  hist.replaceChildren(historyBand(r));
  hist.hidden = false;
  /* Fetched when the band is first drawn rather than when the page loads: history is
     read one rule at a time, and previewing every rule on arrival is already enough
     work for a page that has just opened. */
  if (meta(r).savedKey && !meta(r).history) loadHistory(r);

  /* Last, and sunk: it is the one band that answers rather than asks. */
  const live = liveBand(r);
  if (live) pane.append(live);
}

/* ── Overhead right now ───────────────────────────────────────────────────
   The database band answers what a rule can ever select. This one answers the question
   actually being asked while a rule is written: if I saved this, what would it alert on?
   So it runs against the last poll with every condition applied — altitude, distance and
   flight path included, none of which the database can answer.

   It is shown for every rule, including the ones the database cannot preview at all: a
   squawk- or altitude-only rule has no figure above it and this is the only check it
   gets. */
/* How old the poll behind an answer is by now: as old as it was when the server said so,
   plus however long the answer has been sitting on screen. A cached `fresh` cannot be
   trusted on its own — a feeder that stops after an answer lands would go on reading as
   an empty sky, which is the one thing this band must never say. Stale by the same rule
   /healthz uses, mirrored here so it can be applied without asking again. */
function liveAge(r) {
  const m = meta(r), L = m.preview?.live;
  if (!L || L.age_s == null || !m.at) return null;
  return L.age_s + (Date.now() - m.at) / 1000;
}
function liveFresh(r) {
  const L = meta(r).preview?.live;
  if (!L?.fresh) return false;
  const age = liveAge(r), poll = pollEvery();
  if (age == null) return true;
  /* Never call the sky stale sooner than the page is allowed to ask again, or a very
     short poll interval spends half its time warning about an answer it has not been
     permitted to fetch yet. */
  return age <= Math.max(poll * 3, liveEvery() + poll);
}
const pollEvery = () => parseDuration(setting('source.poll_interval', doc.source.poll_interval)) || 15;

function liveBand(r) {
  const p = meta(r).preview;
  const L = p && !p.error && p.live;
  if (!L) return null;

  const sec = el('div', 'group ans');
  const gh = el('div', 'group-h');
  const t = el('div', 'group-t');
  t.append(el('h3', 'lbl', 'Preview'));
  gh.append(t);
  sec.append(gh);

  /* What the band is currently claiming, so the ticker can notice the claim expiring
     without an answer having to arrive to tell it. */
  meta(r).shownFresh = liveFresh(r);
  if (!meta(r).shownFresh) {
    sec.append(el('p', 'help warn', 'Nothing recent from the receiver, so there is nothing to check this rule against.'));
    return sec;
  }
  const overhead = `${(L.overhead || 0).toLocaleString()} aircraft overhead`;
  if (!L.total) {
    sec.append(el('p', 'help', `None of the ${overhead} match this rule right now.`));
    return sec;
  }
  /* Muted is a real answer to "would this alert", not a detail: the rule matches and
     sends nothing. Said here rather than only next to the priority field, because this
     is the band that claims an alert. */
  const muted = r.priority === 0;
  sec.append(el('p', 'help' + (muted ? ' warn' : ''),
    `${L.total.toLocaleString()} of the ${overhead} `
    + (muted ? 'match, but this rule is muted and would send nothing.'
             : `would alert if you saved now${L.total > L.aircraft.length ? `; the nearest ${L.aircraft.length} are shown` : ''}.`)));

  const wrap = el('div', 'hits');
  const table = el('table');
  const thead = el('thead'), hr = el('tr');
  for (const [text, width] of [['Registration', '18%'], ['Callsign', '16%'], ['Type', '30%'],
                               ['Altitude', '18%'], ['Distance', '18%']]) {
    const th = el('th', '', text);
    th.style.width = width;
    hr.append(th);
  }
  thead.append(hr);
  const tbody = el('tbody');
  for (const a of L.aircraft) {
    const tr = el('tr');
    tr.append(el('td', 'reg', a.reg || a.icao),
      el('td', '', a.flight || ''),
      el('td', '', a.type || a.icao_type || ''),
      el('td', 'num', a.altitude_ft == null ? '—' : a.altitude_ft.toLocaleString() + ' ft'),
      el('td', 'num', a.distance_nm == null ? '—' : a.distance_nm.toFixed(1) + ' NM'));
    tbody.append(tr);
  }
  table.append(thead, tbody);
  wrap.append(table);
  sec.append(wrap);
  return sec;
}

/* The roll call sits under the conditions that select it, not above them: the figure is
   what the rule is read by, the rows are what you check it against once it is written. */
function hitsBand(r, cov) {
  const p = meta(r).preview;
  if (p && !p.error && p.aircraft?.length && cov.kind !== 'blind' && cov.kind !== 'wild') {
    const sec = el('div', 'group ans');
    const gh = el('div', 'group-h');
    const t = el('div', 'group-t');
    t.append(el('h3', 'lbl', 'Aircraft this selects'));
    t.append(el('p', 'help', `${p.total.toLocaleString()} of `
      + `${(p.database ?? 0).toLocaleString()} aircraft in the database.`));
    gh.append(t);
    sec.append(gh);
    const wrap = el('div', 'hits db');
    const table = el('table');
    const thead = el('thead'), hr = el('tr');
    for (const [text, width] of [['Registration', '20%'], ['Type', '24%'],
                                 ['Operator', '26%'], ['Tags', '30%']]) {
      const th = el('th', '', text);
      th.style.width = width;
      hr.append(th);
    }
    thead.append(hr);
    const tbody = el('tbody');
    for (const a of p.aircraft) tbody.append(hitRow(a));
    table.append(thead, tbody);
    wrap.append(table);

    /* Inside the scroll region, not below it: the button belongs where the rows run out
       rather than pinned under a list you have not reached the end of. */
    if (p.aircraft.length < p.total) wrap.append(moreButton(r, p));
    sec.append(wrap);
    return sec;
  }
  return null;
}

function moreButton(r, p) {
  const b = el('button', 'btn more');
  b.id = 'more';
  b.type = 'button';
  const remaining = p.total - p.aircraft.length;
  b.textContent = `Show ${Math.min(remaining, p.limit || 20).toLocaleString()} more`;
  /* Unhooked rather than disabled: a second click does nothing either way, and a disabled
     button drops focus to the body, which would cost a keyboard reader their place in the
     list they just asked for more of. */
  b.onclick = () => { b.onclick = null; b.textContent = 'Loading…';
    runPreview(r, p.aircraft.length); };
  return b;
}

/* Reaching further into the list adds to the table already on screen. The rows sit in a
   container with its own scroll, and that scroll is exactly where the operator was
   reading — repainting the band would put them back at the top of a list they had just
   read to the bottom of. Returns false if there is no table to add to, which means the
   pane is showing something else and the caller should paint it properly. */
function appendHits(r) {
  const wrap = $('#pane .hits.db');
  const tbody = wrap?.querySelector('tbody');
  if (!tbody) return false;
  const p = meta(r).preview;
  const at = wrap.scrollTop;
  for (const a of p.aircraft.slice(tbody.children.length)) tbody.append(hitRow(a));
  const old = $('#more');
  if (old) {
    const held = document.activeElement === old;
    if (p.aircraft.length < p.total) old.replaceWith(moreButton(r, p));
    else old.remove();
    /* preventScroll, then put the scroll back: the button has just moved twenty rows
       further down, and following it there would skip the rows it went to fetch. */
    if (held) $('#more')?.focus({preventScroll: true});
  }
  wrap.scrollTop = at;
  return true;
}

function hitRow(a) {
  const tr = el('tr');
  tr.append(el('td', 'reg', a.reg || a.icao),
    el('td', '', a.type || a.icao_type || ''),
    el('td', '', a.operator || ''),
    el('td', 'tg', (a.tags || []).join(', ')));
  return tr;
}

/* ── Sent alerts ──────────────────────────────────────────────────────────
   The bands above answer what a rule would do. This one answers what it did: the
   service's own record of every notification it delivered, as ntfy received it, plus
   the time it went out.

   Filed under the rule's cooldown key — the same string the log and the ledger use — so
   a rule renamed, or an unnamed one re-conditioned, starts a fresh list. The old
   deliveries stay under the key they were sent as rather than being claimed by a rule
   that never sent them. */
function historyBand(r) {
  const m = meta(r), h = m.history;
  const sec = el('div', 'group');
  const gh = el('div', 'group-h');
  const t = el('div', 'group-t');
  t.append(el('h3', 'lbl', 'Alert History'));
  gh.append(t);
  sec.append(gh);

  if (!m.savedKey) {
    sec.append(el('p', 'help', 'Not saved yet, so nothing has been sent.'));
    return sec;
  }
  if (!h) {
    sec.append(el('p', 'help', 'Loading…'));
    return sec;
  }
  if (h.error) {
    sec.append(el('p', 'help bad', 'Could not be read: ' + h.error));
    return sec;
  }
  if (!h.total) {
    sec.append(el('p', 'help', 'Nothing sent yet.'
      + (m.key && m.key !== m.savedKey
        ? ' This rule has been edited since it was saved — earlier alerts are filed under the old version.'
        : '')));
    return sec;
  }
  sec.append(el('p', 'help', `${h.total.toLocaleString()} sent`
    + (h.next ? `; the most recent ${h.alerts.length} are shown.` : '.')));

  const wrap = el('div', 'hits sent');
  for (const a of h.alerts) wrap.append(sentItem(a));
  if (h.next) wrap.append(moreSent(r, h));
  sec.append(wrap);
  return sec;
}

function sentItem(a) {
  const box = el('div', 'sent-i');
  const head = el('div', 'sent-h');
  head.append(el('div', 't', a.title || '(no title)'));
  const when = el('time', 'when', new Date(a.sent_at).toLocaleString());
  when.dateTime = a.sent_at;
  head.append(when);
  box.append(head);
  if (a.message) box.append(el('p', 'sent-m', a.message));

  const foot = el('div', 'sent-f');
  const named = PRIORITIES.find(([v]) => v === a.priority);
  foot.append(el('span', '', `Priority ${a.priority}` + (named ? ` — ${named[1]}` : '')));
  if (a.tags?.length) foot.append(el('span', '', 'Tags: ' + a.tags.join(', ')));
  if (a.click) {
    const link = el('a', '', a.click);
    link.href = a.click;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    foot.append(link);
  }
  box.append(foot);
  return box;
}

function moreSent(r, h) {
  const b = el('button', 'btn more');
  b.id = 'more-sent';
  b.type = 'button';
  /* The count is the one thing here that can go slightly stale — the total is read at
     the moment of asking and deliveries keep arriving — so it is a label, not a promise,
     and the page below it is taken from the cursor either way. */
  const remaining = Math.max(h.total - h.alerts.length, 1);
  b.textContent = `Show ${Math.min(remaining, h.limit || 20).toLocaleString()} more`;
  b.onclick = () => { b.onclick = null; b.textContent = 'Loading…'; loadHistory(r, h.next); };
  return b;
}

/* One page of a rule's history. Paging appends; anything else replaces, so a timed
   reload cannot duplicate rows already on screen.

   The page below is asked for by the cursor the last one handed back rather than by how
   many rows are on screen: an alert delivered while the list is open pushes every row
   down, and a count into it would fetch the last row already displayed a second time. */
async function loadHistory(r, after = '') {
  const m = meta(r), key = m.savedKey;
  if (!key || m.histLoading) return;
  m.histLoading = true;
  m.histAt = Date.now();
  try {
    const res = await fetch('/api/history?' + new URLSearchParams({key, after}));
    const body = await res.json();
    if (!res.ok) throw Error(body.error || `HTTP ${res.status}`);
    /* A save between the asking and the answer refiles the rule under a new key. */
    if (m.savedKey !== key) return;
    m.history = after && m.history?.alerts
      ? {...body, alerts: [...m.history.alerts, ...body.alerts]}
      : body;
  } catch (err) {
    m.history = {error: err.message};
  } finally {
    m.histLoading = false;
  }
  /* renderPane puts the scroll position of every .hits box back, this one included. */
  if (doc.rules.includes(r) && doc.rules[sel] === r) renderPane();
}

/* Priority, When and Research all say what happens when a rule matches, and none of them
   filters, so they are one band rather than a condition each. */
const NOTIFY_WHEN = [['', 'Immediately'], ['closest_pass', 'At Closest Pass']];

function notificationBand(r) {
  const sec = el('div', 'group');
  const gh = el('div', 'group-h');
  const t = el('div', 'group-t');
  t.append(el('h3', 'lbl', 'Notification'));
  t.append(el('p', 'help', 'What happens when this rule matches. None of it changes which aircraft it matches.'));
  gh.append(t);
  sec.append(gh);

  const fields = el('div', 'fields');
  fields.append(whenField(r), priorityField(r));
  sec.append(fields);
  sec.append(researchField(r));
  return sec;
}

/* One alert's worth of facts(), verbatim in shape and in order: every line facts() can
   write, so what is on screen is the whole of what the model is sent and not a sample of
   it. A real alert is shorter — a field the aircraft did not report is simply absent.
   Kept in step with facts() by TestSampleFactsShowsEveryLine. */
const SAMPLE_FACTS = [
  'Registration: N12345',
  'ICAO: adeb2f',
  'Type: C-17',
  'Callsign: RCH123',
  'Route: KCHS (Charleston) \u2192 EDDK (Cologne)',
  'Description: BOEING C-17A',
  'Owner/operator: UNITED STATES AIR FORCE',
  'Year: 1998',
  'Altitude: 31000 ft',
  'Vertical rate: -1088 ft/min',
  'Ground speed: 412 kt',
  'Heading: 78\u00b0',
  'Squawk: 4571',
  'Position: 32.9126, -96.6389',
  'Distance from receiver: 3.2 NM',
  'Circling: yes',
  'Feeder flags: military',
].join('\n');

/* Research is the third thing that happens when a rule matches, and like the other two it
   changes nothing about what matches. Its own row rather than a cell in the grid above: a
   210px column is not where anyone writes a sentence. */
function researchField(r) {
  const wrap = el('div', 'field');
  wrap.append(el('span', 'lbl', 'Research'));
  const on = r.research === true;
  const vals = el('div', 'vals');
  const b = el('button', 'chip toggle');
  b.type = 'button';
  b.id = 'rule-research';
  b.setAttribute('aria-pressed', String(on));
  b.append(el('span', 'v', 'AI Research'));
  b.onclick = () => {
    /* Turning it off drops the prompt with it: a prompt on a rule that asks nothing is
       a line in the file that does nothing, and the placeholder brings the default back. */
    if (on) { delete r.research; delete r.research_prompt; } else r.research = true;
    markDirty(); renderPane();
  };
  vals.append(b);
  wrap.append(vals);
  if (!on) {
    wrap.append(el('span', 'help',
      'Off. The notification says only what the feed and the aircraft database know.'));
    return wrap;
  }
  /* The server cannot refuse this at save time — the page edits the alerts document,
     and whether a provider is configured is a fact the validator sees only as part of
     this same document — so the warning is here rather than after a save that
     succeeded and changed nothing. */
  if (!aiReady()) {
    const bad = el('span', 'help bad', 'No AI provider is set up yet, so this rule will send without its research line. ');
    const go = el('button', 'linkish', 'Set one up in Settings.');
    go.type = 'button';
    go.onclick = () => select('settings');
    bad.append(go);
    wrap.append(bad);
  }
  const ta = el('textarea');
  ta.id = 'rule-research-prompt';
  ta.rows = 3;
  ta.placeholder = defaultPrompt;
  ta.value = r.research_prompt || '';
  ta.setAttribute('aria-label', 'Research prompt');
  ta.oninput = () => {
    const v = ta.value.trim();
    if (v) r.research_prompt = ta.value; else delete r.research_prompt;
    markDirty();
  };
  wrap.append(ta);
  wrap.append(el('span', 'help',
    'Asked about every aircraft this rule claims, with what the alert already knows about '
    + 'it appended. The answer becomes one line of the notification; a call that fails '
    + 'costs that line and nothing else. Leave it empty to ask the default above.'));
  /* The appended half of the question, shown rather than described: the prompt above is
     written against these lines, and a field an alert has nothing for is simply absent. */
  wrap.append(el('span', 'help', 'Sent with it, as the aircraft allows:'));
  wrap.append(el('pre', 'sample', SAMPLE_FACTS));
  return wrap;
}

/* Both choices on screen at once, because the whole question is which of the two this
   rule is. A div rather than a label: a label names one control, and this is two. */
function whenField(r) {
  const wrap = el('div', 'field narrow');
  wrap.append(el('span', 'lbl', 'When'));
  const held = r.notify === 'closest_pass';
  const group = el('div', 'vals');
  group.setAttribute('role', 'radiogroup');
  group.setAttribute('aria-label', 'When');
  for (const [v, t] of NOTIFY_WHEN) {
    const opt = el('label', 'chip radio');
    const input = el('input');
    input.type = 'radio';
    input.name = 'notify-when';
    /* An id, because renderPane puts the focus back by id: without one, arrowing from
       one choice to the other would re-render the band and drop the keyboard on
       the floor, and so would a preview landing mid-choice. */
    input.id = 'notify-when-' + (v || 'on-sight');
    input.checked = v === (held ? 'closest_pass' : '');
    input.onchange = () => {
      if (v) r.notify = v; else delete r.notify;
      markDirty(); renderPane(); renderList();
    };
    /* The text sits loose in the label rather than in a .v, which is the chip's
       one-line-with-an-ellipsis span — this one may wrap on a phone. */
    opt.append(input, document.createTextNode(t));
    group.append(opt);
  }
  wrap.append(group);
  /* The server refuses a held rule with nowhere to be closest to, so say it here rather
     than at the bottom of the page after a failed write. */
  const noReceiver = setting('lat', doc.lat) == null || setting('lon', doc.lon) == null;
  wrap.append(held && noReceiver
    ? el('span', 'help bad', 'Set the receiver position in Settings first.')
    : el('span', 'help', held
      ? 'Waits for the aircraft to pass, then sends one alert reporting the nearest point it reached.'
      : 'Alerts on the first check that matches.'));
  return wrap;
}

function priorityField(r) {
  const pl = el('label', 'field narrow');
  const lbl = el('span', 'lbl', 'Priority');
  /* Native tooltip rather than a widget: it is a footnote to a field whose own help line
     already says what the chosen level does. */
  lbl.title = 'How loudly ntfy announces an alert: 5 pops over other apps and vibrates, '
    + '3 arrives as a normal notification, 1 arrives silently. 0 mutes the rule.';
  pl.append(lbl);
  const s = el('select');
  s.append(new Option('Use the default', INHERIT));
  for (const [v, t2] of PRIORITIES) s.append(new Option(`${v} — ${t2}`, v));
  /* ?? not ||: priority 0 is "muted", a real choice, and must not read as unset. */
  s.value = r.priority ?? INHERIT;
  s.onchange = () => {
    if (s.value === INHERIT) delete r.priority; else r.priority = Number(s.value);
    markDirty(); renderPane(); renderList();
  };
  pl.append(s);
  pl.append(el('span', 'help', r.priority === 0
    ? 'Muted. Matching aircraft stop here and nothing is sent — this is how you write an exception.'
    : r.priority == null
      ? `Follows the default of ${doc.ntfy.priority}.`
      : r.priority >= 4
        ? 'Overrides the default. Pops over other apps and vibrates.'
        : r.priority <= 2
          ? 'Overrides the default. Arrives quietly, without a sound.'
          : 'Overrides the default. A normal notification.'));
  return pl;
}

/* ── Settings ─────────────────────────────────────────────────────────── */
function renderSettings(pane) {
  const head = el('div', 'pane-h');
  const back = el('button', 'btn icon back settings-back');
  back.innerHTML = svg(I.left, 15);
  back.setAttribute('aria-label', 'Back to the rule list');
  back.onclick = closeSettings;
  head.append(back, el('h2', '', 'Settings'));
  pane.append(head);

  const band = (title, help, fields) => {
    const sec = el('div', 'group');
    const gh = el('div', 'group-h');
    const t = el('div', 'group-t');
    t.append(el('h3', 'lbl', title));
    if (help) t.append(el('p', 'help', help));
    gh.append(t);
    sec.append(gh);
    const grid = el('div', 'fields');
    for (const f of fields) grid.append(settingField(f));
    sec.append(grid);
    pane.append(sec);
  };

  band('Receiver', 'Needed for distance and predicted-pass conditions. Leave blank if no rule uses one.', [
    {key: 'lat', label: 'Latitude', type: 'number', step: 'any', min: -90, max: 90},
    {key: 'lon', label: 'Longitude', type: 'number', step: 'any', min: -180, max: 180},
  ]);
  band('Notifications', null, [
    {key: 'ntfy.priority', label: 'Default priority',
     options: PRIORITIES.filter(([v]) => v > 0).map(([v, t]) => [String(v), `${v} — ${t}`]),
     help: 'Used by any rule that does not set its own.'},
    {key: 'cooldown', label: 'Cooldown', placeholder: '24h',
     help: 'Stay quiet this long after alerting about the same aircraft. Counted per rule.'},
  ]);
  band('Timing and logging', null, [
    {key: 'source.poll_interval', label: 'Check for aircraft every', placeholder: '15s',
     help: 'A circling condition needs 30s or less to see a full turn.'},
    {key: 'db.refresh_interval', label: 'Update the database every', placeholder: '24h'},
    {key: 'log_level', label: 'Log level',
     options: ['debug', 'info', 'warn', 'error'].map(v => [v, v])},
  ]);

  band('AI research', 'Answers rules that ask who an aircraft belongs to. Any OpenAI-compatible provider works — OpenRouter, Ollama, vLLM, OpenAI — and "/chat/completions" is added to the endpoint.', [
    {key: 'ai.url', label: 'Endpoint', placeholder: 'https://openrouter.ai/api/v1',
     help: 'Leave this and the model blank to turn research off. The stored key is removed with it.'},
    {key: 'ai.model', label: 'Model', placeholder: 'perplexity/sonar',
     help: 'Passed through as written. Searching the web is the model\'s job: pick one that does it.'},
    {key: 'ai.key', label: 'API key', secret: true},
    {key: 'ai.timeout', label: 'Give up after', placeholder: '20s',
     help: 'A slow answer delays later alerts, since notifications are sent one at a time.'},
  ]);

  const foot = el('div', 'group');
  foot.append(el('p', 'help',
    'Saved changes take effect within five seconds. The feeder address, ntfy account and cache settings are startup-only and not editable here.'));
  foot.append(el('p', 'help',
    'Changes made outside this page — PUT /api/alerts, or -config-import — are picked up too. A direct edit to the database row is not: it must also bump that row\'s version column, which only those two paths do.'));
  foot.append(saveBtn);
  pane.append(foot);
}

function settingField(f) {
  const wrap = el('label', 'field');
  wrap.append(el('span', 'lbl', f.label));
  const input = f.options ? el('select') : el('input');
  if (f.options) for (const [v, t] of f.options) input.append(new Option(t, v));
  else {
    input.type = f.secret ? 'password' : (f.type || 'text');
    if (f.secret) input.autocomplete = 'off';
    if (f.step) input.step = f.step;
    if (f.min !== undefined) input.min = f.min;
    if (f.max !== undefined) input.max = f.max;
    if (f.placeholder) input.placeholder = f.placeholder;
  }
  input.id = 'set-' + f.key;
  const value = at(doc, f.key);
  input.value = value === null || value === undefined ? '' : String(value);
  /* The key is never sent to this page, so the box starts empty whether or not one is
     stored. The placeholder is what says which. */
  if (f.secret) input.placeholder = aiKeySet ? '•••••••• stored — type to replace' : 'Not set';

  const lock = locks[f.key];
  if (lock) {
    input.disabled = true;
    /* Only a secret has nothing to show — the server deliberately withholds its value.
       Every other locked field can be filled with what the environment set and read as
       ordinary, if uneditable, text instead of going blank. */
    input.value = f.secret ? '' : lock.value;
    /* A select only shows a value that matches one of its options exactly, and the raw
       environment string might not — SKY_NTFY_PRIORITY=03 loads as priority 3 but is not
       the option value "3". Build an option out of the raw string rather than silently
       leaving the control showing nothing. */
    if (f.options && !f.secret && input.value !== lock.value) {
      input.add(new Option(lock.value, lock.value), input.firstChild);
      input.value = lock.value;
    }
    wrap.append(input);
    const note = el('span', 'help lock');
    if (!f.secret) {
      note.append('Set by ' + lock.env + ' environment variable.');
      wrap.append(note);
      return wrap;
    }
    /* A locked secret has no value to show: the server deliberately does not send it. An
       empty key is not a secret, but a value here would still be pointless: the env wins
       on every reload, so what gets saved is never what runs. */
    if (f.key === AI_KEY && lock.value === '') {
      note.append('Silenced by ' + lock.env + ', set to empty — a key entered here would ' +
        'be saved but discarded on the next reload. Remove ' + lock.env + ' to use one.');
      wrap.append(note);
      /* Typing is refused, but clearing is not: a stored key can still strand the
         endpoint (checkAIKeyStaysPut judges the file regardless of this override), and
         the only way off that is to enter a key for the new host — impossible here — or
         clear the one on file. That must stay reachable even though the box is not. */
      if (aiKeySet) {
        const clear = el('button', 'mini', 'Clear stored key');
        clear.type = 'button';
        clear.onclick = () => {
          put(doc, AI_KEY, '');
          keyEdited = true;
          aiKeySet = false;
          markDirty();
          renderPane();
        };
        wrap.append(clear);
      }
      return wrap;
    }
    if (lock.value === undefined) {
      note.append('Set by ' + lock.env + ', which wins over this file.');
    } else {
      note.append('Set to ', el('span', 'env', String(lock.value)), ' by ' + lock.env + ', which wins over this file.');
    }
    wrap.append(note);
    return wrap;
  }
  /* An environment key pins its endpoint: the key cannot be replaced from here, so a new
     one cannot be supplied for a new host, and the server refuses the move. A disabled
     box says that once; an editable one would say it on every save.
     An empty override holds no credential — the server has no value to omit, so its
     lock still carries one (''), which is how this is told apart from a real key. */
  if (f.key === 'ai.url' && locks[AI_KEY] && locks[AI_KEY].value === undefined) {
    input.disabled = true;
    wrap.append(input, el('span', 'help lock',
      'Pinned by ' + locks[AI_KEY].env + ', which holds the API key. Set SKY_AI_URL to move it.'));
    return wrap;
  }
  input.oninput = () => {
    /* Typing in the key box at all is what puts a key in the save. Until then the
       payload carries none, which is how the server is told to keep the stored one —
       and an empty box after typing is how it is told to clear it. */
    if (f.secret) {
      keyEdited = true;
      put(doc, f.key, input.value);
      markDirty();
      /* The box now carries a key for wherever the endpoint points, so whatever this
         line was warning about is answered. */
      $('#ai-key-help')?.replaceWith(keyHelp());
      return;
    }
    /* Blank means null only where the setting is genuinely optional. Everywhere
       else a JSON null is a no-op on a non-pointer field, which would silently
       keep the old value instead of the one on screen. */
    const optional = f.key === 'lat' || f.key === 'lon';
    if (f.type === 'number') {
      put(doc, f.key, input.value === '' ? (optional ? null : 0) : Number(input.value));
    } else if (f.key === 'ntfy.priority') {
      put(doc, f.key, Number(input.value));
    } else {
      put(doc, f.key, input.value);
    }
    markDirty();
    /* Both of these decide whether a rule's conditions are legal, so every rule's
       warnings move with them. */
    if (f.key === 'lat' || f.key === 'lon' || f.key === 'source.poll_interval') renderList();
    /* The receiver is what every distance and predicted-pass rule is measured from, so
       moving it changes what each of them is overhead of. */
    if (f.key === 'lat' || f.key === 'lon') doc.rules.forEach(schedulePreview);
    /* Turning the provider on or off changes what every research rule can say. */
    if (f.key === 'ai.url' || f.key === 'ai.model') renderList();
    /* Repaint just the one line rather than the pane: this fires per keystroke, and
       half-typed URLs are the normal state of a box being edited. */
    if (f.key === 'ai.url') {
      const help = $('#ai-key-help');
      if (help) help.replaceWith(keyHelp());
    }
  };
  wrap.append(input);
  if (f.secret) wrap.append(keyHelp());
  if (f.help) wrap.append(el('span', 'help', f.help));
  return wrap;
}

const AI_KEY = 'ai.key';

/* What the key box has to say, which depends on where the endpoint now points. */
function keyHelp() {
  const stranded = keyStrandedBy(doc.ai?.url || '');
  const line = el('span', stranded ? 'help bad' : 'help', stranded
    ? 'The endpoint has moved. The stored key was issued for ' + keyOrigin + ' and is never '
      + 'sent to this page, so it cannot follow — enter the key for the new endpoint, or '
      + 'clear this box to remove it.'
    : aiKeySet
      ? 'Stored on the server and never sent to this page. Leave it blank to keep it; clear the box after typing to remove it.'
      : 'Sent to the provider, not to this page. Some local providers need none.');
  line.id = 'ai-key-help';
  return line;
}

/* ── Preview ──────────────────────────────────────────────────────────────
   One request per rule. Conditions change a keystroke at a time, so the
   requests coalesce; two quick edits can also have their answers arrive out of
   order, so only the newest may paint.                                       */
function schedulePreview(r) {
  const m = meta(r);
  clearTimeout(m.timer);
  m.timer = setTimeout(() => { m.timer = null; runPreview(r); }, 300);
}

/* A condition left empty states nothing, so the rule that is previewed — and
   saved — is the rule with the blanks dropped. Reading it in one place is what
   keeps the preview from answering a different question than the save. */
function payloadRule(r) {
  const out = {name: r.name || ''};
  if (r.priority !== undefined && r.priority !== null) out.priority = r.priority;
  if (r.notify) out.notify = r.notify;
  if (r.research) {
    out.research = true;
    if (r.research_prompt && r.research_prompt.trim()) out.research_prompt = r.research_prompt;
  }
  for (const key of CONDITIONS.map(c => c.key)) {
    const v = r[key];
    if (!hasValue(v)) continue;
    out[key] = LIST_KEYS.includes(key) ? v.map(String) : v;
  }
  return out;
}

/* The coordinates the preview measures distances from: the ones on screen, which are
   not yet the saved ones. Both are always sent, blank included — a page that has had its
   receiver cleared is saying something, and saying nothing would let the server answer
   from the saved pair and show distances from a place this configuration no longer
   knows. One alone measures nothing, so a half pair reads as cleared too. The server
   still lets the environment override them, as saving does. */
function receiver() {
  const send = v => Number.isFinite(Number(v)) && v !== null && v !== '' ? String(v) : '';
  const lat = send(setting('lat', doc.lat)), lon = send(setting('lon', doc.lon));
  return lat && lon ? {lat, lon} : {lat: '', lon: ''};
}

/* What a preview answered, written down: the conditions exactly as they were sent, and
   the receiver they were measured from. Held against the rule on screen it says whether
   the count in hand is an answer about this rule or about the one it used to be — which
   an age cannot say, and which a save must not guess at.

   The name, the priority, when to notify and the two research keys are dropped: none of
   them reaches the matching, so none can move the count, and a rename does not even ask
   for a new preview. Keeping them here would leave a renamed rule — or one whose research
   toggle was touched — permanently mismatched and quietly unwarned. */
const question = r => {
  const {name, priority, notify, research, research_prompt, ...conditions} = payloadRule(r);
  return JSON.stringify([conditions, receiver()]);
};

/* An answer is usable unless the question has moved on, or a later answer to the same
   question already landed. Marking the landing here is what stops the older of two
   answers in flight from painting over the newer one. */
function stale(m, seq, req) {
  if (m.seq !== seq || req < (m.landed || 0)) return true;
  m.landed = req;
  return false;
}

async function runPreview(r, offset = 0, refresh = false) {
  const m = meta(r);
  const asked = question(r);
  /* Two numbers, because "superseded" and "out of date" are not the same thing. seq is
     the question: an edit asks a new one, so answers to the old one are wrong and must
     be dropped. req is the asking: a timed refresh re-asks the same question, so its
     predecessor's answer is still an answer to it — only staler. Discarding those too
     would starve the band on any page whose answers outlive the retry. */
  const req = (m.req || 0) + 1;
  m.req = req;
  const seq = refresh ? m.seq || 0 : (m.seq || 0) + 1;
  m.seq = seq;
  /* When this rule was last asked about, and whether it is still waiting. The ticker
     paces itself on these rather than on how old the answer is: a feeder that has
     stopped leaves an answer that is permanently too old, and pacing on that would put
     a database scan on every tick and leave each response superseded by the next before
     it could land. */
  m.asked = Date.now();
  m.pending = true;
  try {
    const res = await fetch('/api/preview?' + new URLSearchParams(
        {offset, ...receiver()}), {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payloadRule(r)),
    });
    const body = await res.json();
    if (stale(m, seq, req)) return;
    if (!res.ok) throw Error(body.error || `HTTP ${res.status}`);
    const prev = m.preview;
    m.preview = offset > 0 && prev
      /* Paging appends: the count and the rows already on screen stay put, so
         reaching further into a long list never looks like a fresh result. */
      ? {...prev, ...body, aircraft: [...prev.aircraft, ...body.aircraft],
         facets: prev.facets}
      /* A timed refresh is asking a live question, not a new one: the database rows the
         operator has paged through stay where they were. An edit still resets them,
         because then they are answering a different rule. */
      : refresh && prev?.aircraft?.length > body.aircraft.length
        ? {...body, aircraft: prev.aircraft}
        : body;
    m.at = Date.now();
    m.answered = asked;
    if (body.key) m.key = body.key;
    if (body.database != null) dbRows = body.database;
  } catch (err) {
    if (stale(m, seq, req)) return;
    m.preview = {error: err.message, total: 0, aircraft: []};
  } finally {
    /* Only the newest request may say the page is idle: an older one finishing while it
       is still in flight would let the ticker ask again on top of it. */
    if (m.req === req) m.pending = false;
  }
  /* The rule may have been deleted while its answer was in flight. */
  if (!doc.rules.includes(r)) return;
  renderList();
  if (doc.rules[sel] !== r) return;
  if (offset > 0 && !m.preview.error && appendHits(r)) return;
  renderPane();
}

/* The band claims "right now", so it has to keep earning it. Two things do that on
   separate clocks, which is why the ticker is fast and what it does is not:

     the claim   expiring is local arithmetic and has to keep up with the freshness
                 window however short the poll is, so it is checked every second and
                 repainted the moment it stops being true — waiting on an answer that
                 may never come is exactly the failure it exists to show;
     the answer  costs a database scan, so it is paced by the feeder instead — never
                 faster than LIVE_MIN_FETCH_S however often the feeder is polled, timed
                 from when the last request went out rather than from how old its answer
                 is, and never while one is still outstanding.

   Only the rule on screen: a preview nobody is looking at is a request nobody needs. */
const LIVE_TICK_MS = 1000;
const LIVE_MIN_FETCH_S = 5;
const liveEvery = () => Math.max(pollEvery(), LIVE_MIN_FETCH_S);
function refreshLive() {
  if (!doc || isSettings()) return;
  const r = doc.rules[sel];
  if (!r) return;
  const m = meta(r);
  /* The record of what was sent is refreshed on the same clock: a rule that fires while
     it is on screen should not need a reload to show it. Only the first page — reloading
     a list somebody has paged deeper into would throw away their place in it. */
  if (m.savedKey && !m.histLoading && Date.now() - (m.histAt ?? 0) >= liveEvery() * 1000
      && (m.history?.alerts?.length ?? 0) <= (m.history?.limit ?? 20)) loadHistory(r);
  /* Repainting under an open popover leaves its anchor detached, which costs the focus
     return — a stale sky claiming to be current costs more. */
  if (m.shownFresh !== undefined && m.shownFresh !== liveFresh(r)) return renderPane();
  if (document.hidden || closePop || m.timer) return;
  const every = liveEvery() * 1000, since = Date.now() - (m.asked ?? 0);
  /* Outstanding is advisory, not a lock: nothing times a fetch out, and a hung one must
     not be the last request this page ever makes. If it does answer after the retry has
     gone out, it still lands — whichever of the two arrives last is the one kept. */
  if (m.pending && since < every * 3) return;
  if (since >= every) runPreview(r, 0, true);
}
setInterval(refreshLive, LIVE_TICK_MS);
/* A backgrounded tab skips every tick, so its answer is as old as the time away. Ask
   again the moment it is looked at rather than showing that on a heading saying now. */
document.addEventListener('visibilitychange', refreshLive);

/* ── Load and save ────────────────────────────────────────────────────── */
function addRule() {
  const r = {name: ''};
  doc.rules.push(r);
  sel = doc.rules.length - 1;
  markDirty();
  renderList();
  renderPane();
  runPreview(r);
  document.body.dataset.view = 'detail';
}

function payload() {
  const out = structuredClone(doc);
  out.rules = doc.rules.map(payloadRule);
  /* An untouched key box sends no key, which is the server's cue to keep the one it has.
     This page is never given the stored key, so it has nothing to send back and must not
     invent one — a save of the poll interval would otherwise wipe the credential. */
  if (!keyEdited) delete out.ai?.key;
  return out;
}

/* ── The safeguard against a save that floods ─────────────────────────────
   A rule with no condition notifies on every aircraft the receiver hears, and one
   stating only `listed` narrows who those aircraft are without narrowing how many.
   But the shape of a rule is only a proxy for the thing worth warning about: how many
   pushes land the moment the save does. The preview already answers that for every
   rule, against the last poll and the whole rule, so the warning asks it instead — and
   falls back to the shape when there is no current answer to ask. Both are legitimate
   things to want and very easy things to leave behind by accident, so they cost a
   confirmation rather than being refused. Priority 0 is muted and sends nothing, so it
   needs no warning. */
const FLOOD = 3;
/* How many pushes a rule sends the instant it is saved. Infinity is the honest answer
   for an unbounded rule with no count to go on: unknown, and certainly not a number to
   save without being told. */
function immediate(r) {
  if (r.priority === 0) return 0;
  /* An edit's preview is still in flight, or 300ms from being asked for: the count on
     hand answers the rule as it was before the edit, and the condition just removed is
     exactly the one keeping that count small. */
  if (!liveFresh(r) || meta(r).answered !== question(r))
    return stated(r).every(k => k === 'listed') ? Infinity : 0;
  return meta(r).preview?.live?.total || 0;
}

async function save() {
  const loud = doc.rules.filter(r => immediate(r) > FLOOD);
  if (loud.length && !confirm(
      loud.map(r => {
        const n = immediate(r);
        return ruleLabel(r) + ': ' + (Number.isFinite(n)
          ? n.toLocaleString() + ' aircraft overhead right now'
          : 'every aircraft the receiver hears');
      }).join('\n')
      + (loud.length > 1
          ? '\n\nThese rules would send that many notifications the moment you save. '
          : '\n\nThis rule would send that many notifications the moment you save. ')
      + 'Add a condition, or mute it, to stop that.\n\nSave anyway?'))
    return;
  const b = saveBtn;
  b.disabled = true;
  b.textContent = 'Saving…';
  try {
    const res = await fetch('/api/alerts', {
      method: 'PUT', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload()),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw Error(body.error || `Save failed (HTTP ${res.status}).`);
    message('Saved. The change takes effect within five seconds.', 'good');
    dirty = false;
    b.classList.add('done');
    b.textContent = 'Saved';
    await load();
  } catch (err) {
    message(err.message, 'bad');
    b.disabled = false;
    b.textContent = 'Save';
  }
}

async function load() {
  const res = await fetch('/api/alerts');
  if (!res.ok) {
    let detail;
    try { detail = (await res.json()).error; } catch {}
    throw Error(detail || `Could not load your settings (HTTP ${res.status}).`);
  }
  const body = await res.json();
  doc = body.alerts;
  doc.rules = doc.rules || [];
  vocab = body.vocabulary || {};
  feedTypes = body.feed_types || [];
  aiKeySet = body.ai_key_set === true;
  keyEdited = false;
  keyOrigin = originOf(doc.ai?.url || '');
  doc.ai = doc.ai || {};
  defaultPrompt = body.research_prompt_default || '';
  locks = Object.fromEntries((body.locked || []).map(l => [l.key, l]));
  const keys = body.rule_keys || [];
  /* key follows the draft as it is edited; savedKey is what the running service filed
     its deliveries under, and is the only one history can be asked for. */
  doc.rules.forEach((r, i) => { meta(r).key = meta(r).savedKey = keys[i] || ''; });
  if (sel !== 'settings' && sel > doc.rules.length - 1) sel = Math.max(0, doc.rules.length - 1);
  renderList();
  renderPane();
  /* Every rule is previewed on arrival: a rule that has quietly stopped matching
     anything is exactly what this page exists to show, and asking for it one rule
     at a time would mean never noticing. */
  doc.rules.forEach(r => runPreview(r));
}

$('#settings').innerHTML = svg(I.sliders, 15);
$('#settings').onclick = () => select('settings');
$('#brand').onclick = () => { if (isSettings()) closeSettings(); else document.body.dataset.view = 'list'; };
addEventListener('popstate', () => {
  sel = location.pathname === '/settings' ? 'settings' : (typeof prevSel === 'number' ? prevSel : 0);
  renderList();
  renderPane();
});
$('#add').onclick = addRule;
saveBtn.onclick = save;
addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); if (dirty) save(); }
});
addEventListener('beforeunload', e => { if (dirty) e.preventDefault(); });

document.body.dataset.view = 'list';
if (location.pathname === '/settings') sel = 'settings';
load().catch(err => {
  message(err.message, 'bad');
  const e = el('div', 'empty');
  e.append(el('h2', '', 'Could not load'));
  e.append(el('p', 'help', 'sky-notify is still running on its last saved settings. Check the log, then reload this page.'));
  const again = el('button', 'btn', 'Reload');
  again.type = 'button';
  again.onclick = () => location.reload();
  e.append(again);
  $('#pane').replaceChildren(e);
});
</script>
</html>
