# Nothing alerts unless a rule says so. Every key is optional and hot-reloaded.
# Startup-only settings live in config.yaml. Mount beside it or set SKY_ALERTS_CONFIG.

source:
  poll_interval: 15s
ntfy:
  priority: 3          # default for rules that omit priority
db:
  refresh_interval: 24h
cooldown: 24h

# Your receiver. Required by any rule that sets max_distance_nm.
lat: 51.5007
lon: -0.1246

# Every rule is one thing you asked to hear about. Names must be unique: the name is the
# cooldown key, so two rules matching one aircraft stay quiet independently of each other.
# Conditions within a rule are ANDed; values within one field are ORed. First match wins.
rules:
  - name: Emergency squawks
    squawk: ["7500", "7600", "7700"]
    priority: 5

  - name: Listed aircraft nearby
    listed: true
    max_distance_nm: 50

  - name: Unlisted low flyers
    listed: false
    max_altitude_ft: 2000
    max_distance_nm: 3

log_level: info
