# Nothing alerts unless a rule says so, and no alert is sent until the aircraft has
# reported a position. Every key is optional and hot-reloaded.
# Startup-only settings live in config.yaml. Mount beside it or set SKY_ALERTS_CONFIG.
# This file can also be edited from the web UI at the configured listen address.

source:
  poll_interval: 15s
ntfy:
  priority: 3          # default for rules that omit priority
db:
  refresh_interval: 24h
cooldown: 24h

# Your receiver. Required by any rule that sets max_distance_nm.
lat: 51.5007
lon: -0.1246

# Every rule is one thing you asked to hear about. Conditions within a rule are ANDed;
# values within one field are ORed. First match wins. Every condition is optional: a rule
# that states none matches every aircraft.
#
# `name` is optional too. It never reaches the notification — it is the cooldown key and
# the log label, so set it on a rule you want to recognise in the log and leave it off one
# whose conditions already say what it is. An unnamed rule is keyed by a fingerprint of its
# conditions instead. Either way the key must be unique, or two rules would silence each
# other: no two rules may share a name or state exactly the same conditions unnamed.
rules:
  - name: Emergency squawks
    squawk: ["7500", "7600", "7700"]
    priority: 5

  - name: Listed aircraft nearby
    listed: true
    max_distance_nm: 50

  - name: Unlisted low flyers
    listed: false
    max_altitude_ft: 2000
    max_distance_nm: 3

  # Predicted from current ground track and speed: will come within 1 NM in the next 5
  # minutes. No name: the conditions are the description.
  - passes_within_nm: 1
    passes_within: 5m      # the default
    max_altitude_ft: 10000

  # A full turn inside 2 NM during the last 10 minutes: news and police helicopters.
  - name: Orbiting aircraft
    circling: true
    max_distance_nm: 10

  # The wildcard is a rule with no conditions. listed: true narrows it to every aircraft
  # in plane-alert-db; on its own it is every aircraft you hear. It matches everything,
  # so it goes last — any rule below it would never be reached.
  # - name: Everything interesting
  #   listed: true

log_level: info
