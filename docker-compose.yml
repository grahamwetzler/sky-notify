services:
  sky-notify:
    image: ghcr.io/grahamwetzler/sky-notify:latest
    container_name: sky-notify
    restart: unless-stopped
    environment:
      # --- required: nothing here has a default, the service refuses to start without it ---
      # Where to read aircraft from. An http(s) URL, or an absolute path if you
      # bind-mount ultrafeeder's data directory.
      SKY_SOURCE_URL: http://ultrafeeder/data/aircraft.json
      # Which ntfy server, and the topic on it. On public ntfy.sh the topic name is
      # the only secret.
      SKY_NTFY_URL: https://ntfy.sh
      SKY_NTFY_TOPIC: your-secret-topic-name
      # Which interesting-aircraft database to mirror, and which files from it.
      SKY_DB_BASE_URL: https://raw.githubusercontent.com/sdr-enthusiasts/plane-alert-db/main
      SKY_DB_FILES: plane-alert-db.csv
      # Where the cached list and cooldown ledger live. Matches the volume below.
      SKY_CACHE_DIR: /data

      # --- optional ---
      # SKY_SOURCE_POLL_INTERVAL: 15s
      # SKY_NTFY_TOKEN: tk_...                   # or SKY_NTFY_USER + SKY_NTFY_PASSWORD
      # SKY_NTFY_PRIORITY: "3"
      # Makes each notification click through to your own map.
      # SKY_TAR1090_URL: http://ultrafeeder/
      # SKY_COOLDOWN: 24h
      # SKY_LOG_LEVEL: info

      # Receiver coordinates for rules with max_distance_nm.
      # SKY_LAT: "51.5007"
      # SKY_LON: "-0.1246"
    volumes:
      # Holds the cached interesting-aircraft list and the alert cooldown ledger.
      # Both survive restarts; without this you re-download the list and re-alert on
      # everything currently overhead every time the container restarts.
      - sky-notify-data:/data
      # Optional YAML config. Everything above can be set this way instead.
      # - ./config.yaml:/config/config.yaml:ro
      # - ./alerts.yaml:/config/alerts.yaml:ro
    networks:
      - adsb
    depends_on:
      - ultrafeeder

  # Optional: archives every aircraft's flight path for later review and replay. See
  # "History and replay" in the README. Needs the two ultrafeeder settings below.
  sky-archive:
    image: ghcr.io/grahamwetzler/sky-archive:latest
    container_name: sky-archive
    restart: unless-stopped
    environment:
      # Fills dim_plane's plane-alert-db columns, which drive the `interesting` view. Unset to skip.
      PLANE_ALERT_CSV_URL: https://raw.githubusercontent.com/sdr-enthusiasts/plane-alert-db/main/plane-alert-db.csv
      # Makes each visit's replay_url open in your own map.
      TAR1090_URL: http://ultrafeeder/
      # ARCHIVE_INTERVAL: "21600"   # seconds between passes
      # SETTLE_HOURS: "2"           # wait this long after UTC midnight before loading a day
    volumes:
      - globe-history:/globe_history:ro
      - sky-archive-lake:/lake

  # Your existing ultrafeeder service — shown only so the example resolves.
  ultrafeeder:
    image: ghcr.io/sdr-enthusiasts/docker-adsb-ultrafeeder:latest
    container_name: ultrafeeder
    restart: unless-stopped
    environment:
      # For sky-archive: readsb records every aircraft's full trace, one file per aircraft
      # per UTC day. tar1090 can replay them for as many days as are kept.
      READSB_ENABLE_TRACES: "true"
      MAX_GLOBE_HISTORY: "90"
    volumes:
      - globe-history:/var/globe_history
    networks:
      - adsb

volumes:
  sky-notify-data:
  globe-history:
  sky-archive-lake:

networks:
  adsb:
