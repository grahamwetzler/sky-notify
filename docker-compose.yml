services:
  sky-notify:
    image: ghcr.io/grahamwetzler/sky-notify:latest
    container_name: sky-notify
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # --- required: nothing here has a default, the service refuses to start without it ---
      # Where to read aircraft from. An http(s) URL, or an absolute path if you
      # bind-mount the feeder's data directory. Point this at the feeder itself: if your
      # map sits behind a reverse proxy with auth, sky-notify sends no credentials.
      SKY_SOURCE_URL: http://feeder.lan/data/aircraft.json
      # Which ntfy server, and the topic on it. On public ntfy.sh the topic name is
      # the only secret.
      SKY_NTFY_URL: https://ntfy.sh
      SKY_NTFY_TOPIC: your-secret-topic-name
      # Which interesting-aircraft database to mirror, and which files from it.
      SKY_DB_BASE_URL: https://raw.githubusercontent.com/sdr-enthusiasts/plane-alert-db/main
      SKY_DB_FILES: plane-alert-db.csv
      # Where the cached list and cooldown ledger live. Matches the volume below.
      SKY_CACHE_DIR: /data

      # --- optional ---
      # Password for the web UI. Without it, anyone who can reach the port can edit
      # your rules and read your credentials.
      # SKY_UI_PASSWORD: change-me
      # SKY_SOURCE_POLL_INTERVAL: 15s
      # SKY_NTFY_TOKEN: tk_...                   # or SKY_NTFY_USER + SKY_NTFY_PASSWORD
      # SKY_NTFY_PRIORITY: "3"
      # Makes each notification click through to your own map.
      SKY_TAR1090_URL: https://adsb.example.com/
      # SKY_COOLDOWN: 24h
      # SKY_LOG_LEVEL: info

      # Receiver coordinates for rules with max_distance_nm or passes_within_nm.
      # SKY_LAT: "51.5007"
      # SKY_LON: "-0.1246"
    volumes:
      # Holds the cached interesting-aircraft list and the alert cooldown ledger.
      # Both survive restarts; without this you re-download the list and re-alert on
      # everything currently overhead every time the container restarts.
      - sky-notify-data:/data
      # Holds config.db, which the web UI writes. Without a writable /config the UI
      # loads and previews but every save fails: the image runs as a non-root user.
      - sky-notify-config:/config
      # To seed config.db without touching a shell inside the container, bind-mount a
      # JSON document in the shape config.example.json documents and run the image once
      # with `-config-import /seed.json` before the normal entrypoint (an init container
      # or a compose `command:` override), e.g.:
      # - ./seed.json:/seed.json:ro

volumes:
  sky-notify-data:
  sky-notify-config:
